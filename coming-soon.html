<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>时光酿造所 · Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold:  #c8a96e;
      --cream: #ede8db;
      --dark:  #0d0c0a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      overflow: hidden;
    }

    /* ── backgrounds ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: var(--dark);
    }

    /* breathing warm glow at bottom */
    .glow {
      position: fixed; bottom: -22%; left: 50%; z-index: 1;
      width: clamp(400px, 90vw, 900px);
      height: clamp(400px, 90vw, 900px);
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110,68,12,.11) 0%, transparent 65%);
      animation: pulse 7s ease-in-out infinite;
    }

    /* noise texture */
    .noise {
      position: fixed; inset: 0; z-index: 2;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
    }

    /* ── stage ── */
    .stage {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      padding: clamp(24px, 5vh, 48px) 32px clamp(20px, 5vh, 44px);
    }

    /* center group: fills remaining space, vertically centers its children */
    .center-group {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(18px, 3.5vw, 38px);
    }

    /* ── typewriter title ── */
    .title-wrap {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(44px, 8vw, 110px);
      line-height: 1;
      white-space: nowrap;
      text-align: center;
      letter-spacing: .02em;
    }

    .title-normal { color: var(--cream); }
    .title-italic  { color: var(--gold); font-style: italic; }

    /* cursor: 1 px wide, height ≈ 1.1× cap-height (~0.75 em),
       vertically centered on cap-height midpoint              */
    .cursor {
      display: inline-block;
      width: 1.5px;
      height: .75em;
      background: #fff;
      margin-left: 2px;
      vertical-align: -0.04em;    /* bottom sits ~0.04 em below baseline so
                                     midpoint aligns with cap centre          */
      animation: blink .6s linear infinite;
    }

    /* ── gold divider ── */
    .divider {
      width: 0;   /* set by JS to match title width */
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 25%, var(--gold) 75%, transparent);
      opacity: 0;
    }

    /* ── subtitle ── */
    .subtitle {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      text-align: center;
      opacity: 0;
    }
    .sub-cn {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 2.2vw, 22px);
      color: rgba(237,232,219,.48);
      letter-spacing: 8px;
    }
    .sub-en {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(14px, 1.8vw, 18px);
      color: rgba(200,169,110,.45);
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* ── logo (压轴) ── */
    .logo {
      width: clamp(360px, 88vw, 720px);
      flex-shrink: 0;
      opacity: 0;
    }

    /* ── footer brand ── */
    .footer {
      position: fixed;
      bottom: clamp(20px, 5vh, 44px);
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: rgba(200,169,110,.32);
      letter-spacing: 4px;
      opacity: 0;
    }

    /* ── keyframes ── */
    @keyframes blink {
      0%,  49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: .65; transform: translateX(-50%) scale(1);    }
      50%       { opacity: 1;   transform: translateX(-50%) scale(1.09); }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="glow"></div>
<div class="noise"></div>

<main class="stage">
  <img class="logo" id="logo" src="/logo.png" alt="时光酿造所"/>

  <div class="center-group">
    <!-- title: normal + italic parts share a single line so cursor follows naturally -->
    <div class="title-wrap">
      <span class="title-normal" id="titleNormal"></span><span
            class="title-italic"  id="titleItalic"></span><span
            class="cursor"        id="cursor"></span>
    </div>

    <div class="divider"  id="divider"></div>

    <div class="subtitle" id="subtitle">
      <span class="sub-cn">正 在 酝 酿</span>
      <span class="sub-en">Coming Soon</span>
    </div>
  </div>
</main>

<footer class="footer" id="footer">· 时光酿造所 ·</footer>

<script>
  // ── text definition ─────────────────────────────────────────────────────────
  // "Something's " is cream (normal), "Brewing." is italic gold
  const FULL_TEXT = "Something's Brewing.";
  const SPLIT_AT  = 12; // indices 0-11 → normal · 12-19 → italic

  const elNormal   = document.getElementById('titleNormal');
  const elItalic   = document.getElementById('titleItalic');
  const elCursor   = document.getElementById('cursor');
  const elDivider  = document.getElementById('divider');
  const elSubtitle = document.getElementById('subtitle');
  const elFooter   = document.getElementById('footer');
  const elLogo     = document.getElementById('logo');

  // ── delay model ─────────────────────────────────────────────────────────────
  function getDelay(ch) {
    // after punctuation (', .) or space: perceptible pause
    if (ch === "'" || ch === '.' || ch === ' ') {
      return 320 + Math.random() * 200;   // 320–520 ms
    }
    // ~15 % of letters: brief hesitation
    if (Math.random() < 0.15) {
      return 380 + Math.random() * 260;   // 380–640 ms
    }
    // normal keystroke
    return 180 + Math.random() * 120;     // 180–300 ms
  }

  // ── fade helper ─────────────────────────────────────────────────────────────
  function fadeIn(el, dur) {
    el.style.transition = `opacity ${dur}s ease`;
    el.style.opacity    = '1';
  }

  // ── stage 4: sequential reveals ─────────────────────────────────────────────
  function startStage4() {
    // match divider width to the rendered title width
    const titleWrap = document.querySelector('.title-wrap');
    elDivider.style.width = titleWrap.offsetWidth + 'px';

    setTimeout(() => fadeIn(elDivider,  0.8),  500);   // divider  @ +500 ms
    setTimeout(() => fadeIn(elSubtitle, 0.8), 1200);   // subtitle @ +1200 ms
    setTimeout(() => fadeIn(elFooter,   0.8), 1800);   // footer   @ +1800 ms
    setTimeout(() => fadeIn(elLogo,     1.1), 2600);   // logo     @ +2600 ms 压轴
  }

  // ── stage 2: typewriter ─────────────────────────────────────────────────────
  function typeChar(index) {
    if (index >= FULL_TEXT.length) {
      // stage 3: cursor fades out 300 ms after last char
      setTimeout(() => {
        elCursor.style.animation  = 'none';
        elCursor.style.transition = 'opacity 0.4s ease';
        elCursor.style.opacity    = '0';
        setTimeout(startStage4, 450);   // stage 4 begins once cursor is gone
      }, 300);
      return;
    }

    const ch = FULL_TEXT[index];
    if (index < SPLIT_AT) {
      elNormal.textContent += ch;
    } else {
      elItalic.textContent += ch;
    }

    setTimeout(() => typeChar(index + 1), getDelay(ch));
  }

  // ── stage 1: cursor flashes alone for 4 blink-cycles (4 × 0.6 s = 2.4 s) ──
  setTimeout(() => typeChar(0), 2400);
</script>

</body>
</html>
