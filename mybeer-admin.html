<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>客制网站后台 · DB BREW</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@600&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600&family=Cormorant+Garamond:wght@500&family=Playfair+Display:wght@600&family=Lora:wght@400&family=Oswald:wght@600&family=Barlow:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6eee3;--card:#fffdf9;--line:#e4d3bd;--ink:#3a2618;--soft:#86705e;--accent:#7d4f27;--ok:#3d6b3f;--err:#9a3a1d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
header h1{margin:0;font-size:20px}
header a{color:var(--accent);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}
.hint{color:var(--soft);font-size:13px;margin:0 0 12px}
.thumb{background:repeating-conic-gradient(#efe6da 0 25%,#f8f2ea 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
.thumb img{display:block;width:100%;max-height:220px;object-fit:contain}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:#efe3d3;color:var(--soft);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:9px 18px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:default}
.file{position:absolute;width:1px;height:1px;opacity:0}
.file:focus-visible+label{outline:2px solid var(--accent)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fonts button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:#fbf7f1;border-radius:8px;padding:12px}
.fonts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#fff}
.fonts .s1{font-size:19px;line-height:1.2;text-transform:uppercase}
.fonts .s2{font-size:15px}
.fonts small{font-size:12px;color:var(--soft)}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.status{font-size:14px;color:var(--soft);min-height:22px}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.login{max-width:340px;margin:12vh auto 0}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;margin:10px 0}
@media (max-width:520px){.fonts{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<form class="card login" id="login">
  <h2>客制网站后台</h2>
  <p class="hint">用后台管理的同一个密码登录。</p>
  <label for="pass" class="hint" style="margin:0">后台密码</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button class="btn" id="login-btn" type="submit">进入</button>
  <p class="status err" id="login-err" role="alert"></p>
</form>

<main id="app" hidden>
  <header>
    <h1>客制网站后台</h1>
    <a href="/mybeer.html" target="_blank" rel="noopener">打开网站 ↗</a>
  </header>

  <section class="card">
    <h2>首页罐子图</h2>
    <p class="hint">建议用透明背景的 PNG 或 WebP，横向排列，宽 2000px 以上，不超过 5MB。换图后，罐子下方的五个场合标签会平均排列。</p>
    <span class="tag" id="lineup-tag">原图</span>
    <div class="thumb"><img id="lineup-preview" src="/mybeer-lineup.webp" alt="首页罐子图预览"></div>
    <div class="row">
      <input class="file" id="file" type="file" accept="image/png,image/webp,image/jpeg">
      <label class="btn" for="file" id="file-btn">上传新图片</label>
      <button class="btn ghost" id="reset" type="button">恢复原图</button>
    </div>
  </section>

  <section class="card">
    <h2>整体字体</h2>
    <p class="hint">网站标题和正文的字体。酒标预览上的字体不受影响。</p>
    <div class="fonts" id="fonts"></div>
  </section>

  <div class="bar">
    <span class="status" id="status" role="status"></span>
    <button class="btn" id="save" type="button" disabled>保存</button>
  </div>
</main>
</div>

<script>
const API = '/api/menu-public?mybeer=1';
const DEFAULT_LINEUP = '/mybeer-lineup.webp';
const MAX_BYTES = 5 * 1024 * 1024;
const FONTS = [
  { key: 'classic', name: '经典衬线（现在）', cap: '"Cinzel",serif', body: '"Noto Serif TC",serif' },
  { key: 'modern',  name: '现代简约', cap: '"Montserrat",sans-serif', body: '"Noto Sans TC",sans-serif' },
  { key: 'elegant', name: '优雅杂志', cap: '"Playfair Display",serif', body: '"Noto Serif TC",serif' },
  { key: 'sport',   name: '运动力量', cap: '"Oswald",sans-serif', body: '"Noto Sans TC",sans-serif' },
];
let PASS = '';
let saved = null;     // what the server has
let draft = null;     // what the owner is editing
let busy = false;
const $ = (id) => document.getElementById(id);

function say(text, cls) { const s = $('status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }
function dirty() { return !!saved && (draft.font !== saved.font || draft.lineupUrl !== saved.lineupUrl); }
function refreshSave() { $('save').disabled = busy || !dirty(); }

async function api(op, body) {
  const res = await fetch(API + '&op=' + op, {
    method: body ? 'POST' : 'GET',
    cache: 'no-store',
    headers: Object.assign({ 'x-admin-pass': PASS }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  let json = {};
  try { json = await res.json(); } catch (_) { json = {}; }
  if (!res.ok || json.code !== 0) {
    const err = new Error(json.message || ('请求失败（' + res.status + '）'));
    err.status = res.status;
    throw err;
  }
  return json.data;
}

function render() {
  $('lineup-preview').src = draft.lineupUrl || DEFAULT_LINEUP;
  $('lineup-tag').textContent = draft.lineupUrl ? '自定义图片' : '原图';
  $('reset').disabled = !draft.lineupUrl;
  $('fonts').innerHTML = FONTS.map((f) =>
    `<button type="button" data-font="${f.key}" aria-pressed="${f.key === draft.font}">` +
    `<span class="s1" style='font-family:${f.cap}'>Custom Beer</span>` +
    `<span class="s2" style='font-family:${f.body}'>客製啤酒包裝</span><small>${f.name}</small></button>`).join('');
  refreshSave();
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  PASS = $('pass').value.trim();
  if (!PASS) return;
  $('login-btn').disabled = true; $('login-err').textContent = '';
  try {
    const data = await api('get');
    saved = { font: data.font, lineupUrl: data.lineupUrl };
    draft = Object.assign({}, saved);
    $('login').hidden = true; $('app').hidden = false;
    render();
    say(data.updatedAt ? '上次保存：' + new Date(data.updatedAt).toLocaleString('zh-CN') : '还没有保存过，网站正在用默认设置。');
  } catch (err) {
    PASS = '';
    $('login-err').textContent = err.status === 401 ? '密码错误，请重试' : err.message;
  } finally {
    $('login-btn').disabled = false;
  }
});

$('fonts').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-font]');
  if (!b || busy) return;
  draft.font = b.dataset.font; render();
  say(dirty() ? '已修改，按「保存」后网站生效。' : '');
});

$('reset').addEventListener('click', () => {
  if (busy) return;
  draft.lineupUrl = ''; render();
  say('已改回原图，按「保存」后网站生效。');
});

$('file').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file || busy) return;
  if (!/^image\/(png|webp|jpeg)$/.test(file.type)) { say('只支持 PNG、WebP、JPG 图片。', 'err'); return; }
  if (file.size > MAX_BYTES) { say('图片不能超过 5MB，请先压缩再上传。', 'err'); return; }
  busy = true; refreshSave(); $('file-btn').setAttribute('aria-disabled', 'true');
  try {
    say('正在准备上传…');
    const sign = await api('upload', { mimeType: file.type, size: file.size });
    say('正在上传图片…');
    const form = new FormData();
    form.append('cacheControl', '31536000');
    form.append('', file);
    const up = await fetch(sign.signedUrl, { method: 'PUT', headers: { 'x-upsert': 'false' }, body: form });
    if (!up.ok) throw new Error('图片上传失败（' + up.status + '）');
    draft.lineupUrl = sign.url;
    render();
    say('图片已上传，按「保存」后网站生效。');
  } catch (err) {
    say(err.status === 401 ? '登录已失效，请刷新页面重新登录。' : err.message, 'err');
  } finally {
    busy = false; $('file-btn').removeAttribute('aria-disabled'); refreshSave();
  }
});

$('save').addEventListener('click', async () => {
  if (busy || !dirty()) return;
  busy = true; refreshSave(); say('正在保存…');
  try {
    const data = await api('save', { font: draft.font, lineupUrl: draft.lineupUrl });
    saved = { font: data.font, lineupUrl: data.lineupUrl };
    draft = Object.assign({}, saved);
    render();
    say('已保存。访客重新打开网站即可看到（最多约 1 分钟）。', 'ok');
  } catch (err) {
    say(err.status === 401 ? '登录已失效，请刷新页面重新登录。' : '保存失败：' + err.message, 'err');
  } finally {
    busy = false; refreshSave();
  }
});

window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
