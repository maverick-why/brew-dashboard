<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>时光酿造所 · 发酵看板</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#05080f; --surface:#0b1018; --card:#0e1520;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --amber:#f5a623; --amber2:#c47d10; --gold:#ffd166;
  --green:#39d98a; --cool:#3fa9ff; --cool2:#1060cc;
  --text:#e8edf8; --sub:rgba(232,237,248,.50); --dim:rgba(232,237,248,.28);
  --font-display:'Bebas Neue','Impact',sans-serif;
  --font-body:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
@media(max-width:639px){html,body{overflow:auto;height:auto}}
body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,.09) 3px,rgba(0,0,0,.09) 4px)}
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px)}
.blob-1{width:700px;height:500px;left:-100px;top:-80px;background:#b8620a;opacity:.12}
.blob-2{width:600px;height:500px;right:-60px;bottom:0;background:#0a4480;opacity:.14}
.blob-3{width:400px;height:400px;left:38%;top:20%;background:#1e5c2a;opacity:.10}
.shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
@media(max-width:639px){.shell{height:auto;min-height:100svh}}
header{flex:0 0 auto;display:flex;align-items:stretch;height:64px;border-bottom:1px solid var(--border2);background:rgba(10,14,22,.92);backdrop-filter:blur(18px);position:sticky;top:0;z-index:100}
@media(max-width:639px){header{height:auto;flex-direction:column;padding-top:env(safe-area-inset-top)}}
.h-brand{display:flex;align-items:center;gap:16px;padding:0 28px;border-right:1px solid var(--border2)}
.h-brand-left{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;min-width:0}
.h-brand img{height:32px;width:auto;max-width:140px;object-fit:contain;border-radius:6px}
.brand-name{font-family:var(--font-display);font-size:24px;letter-spacing:2.5px;color:var(--gold);line-height:.95;text-shadow:0 0 30px rgba(245,166,35,.4)}
.brand-sub{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--sub);margin-top:0;text-transform:uppercase;line-height:1;white-space:nowrap}
.h-center{flex:1;display:flex;align-items:center;justify-content:center;gap:32px}
.h-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.h-stat .sv{font-family:var(--font-display);font-size:26px;color:var(--amber);line-height:1;letter-spacing:2px}
.h-stat .sk{font-size:9px;font-weight:700;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.h-divider{width:1px;height:28px;background:var(--border2)}
.h-right{display:flex;align-items:center;padding:0 24px;border-left:1px solid var(--border2);gap:16px}
.h-right-mobile{display:none}
.h-right-desktop{display:flex}
.h-status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 10px var(--green)}50%{opacity:.6;box-shadow:0 0 20px var(--green)}}
.h-clock{font-family:var(--font-mono);font-size:13px;color:var(--text);font-weight:700;letter-spacing:1px;white-space:nowrap}
.h-date{font-size:10px;color:var(--sub);font-weight:400;letter-spacing:.5px;white-space:nowrap;text-align:right}
.ticker{flex:0 0 auto;height:32px;background:linear-gradient(90deg,#0d1a0a,#0a1520,#0d1a0a);border-bottom:1px solid var(--border);display:flex;align-items:center;overflow:hidden;position:relative}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.ticker::before{left:0;background:linear-gradient(90deg,#0d1a0a,transparent)}
.ticker::after{right:0;background:linear-gradient(270deg,#0a1520,transparent)}
.ticker-track{display:flex;gap:60px;animation:ticker-scroll 60s linear infinite;white-space:nowrap;padding-left:100%}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub)}
.ticker-item .ti-dot{color:var(--amber)}
.ticker-item .ti-val{color:var(--text)}
main{flex:1 1 0;overflow-y:auto;overflow-x:hidden;padding:18px 24px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-content:start}
.card{position:relative;border-radius:4px;background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,transform .3s;animation:card-in .5s ease both}
.card:hover{border-color:var(--border2);transform:translateY(-2px)}
@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.6}
.ribbon{position:absolute;top:14px;left:-28px;width:100px;text-align:center;transform:rotate(-45deg);background:linear-gradient(180deg,#ff3b6b,#c72050);color:#fff;font-size:9px;font-weight:900;letter-spacing:2px;padding:5px 0;z-index:5;box-shadow:0 2px 8px rgba(199,32,80,.5)}
.tank-wrap{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:44px}
.tank-no{font-family:var(--font-display);font-size:44px;line-height:1;color:rgba(232,237,248,.55);letter-spacing:-2px;user-select:none;text-align:center;text-shadow:0 0 20px rgba(232,237,248,.2)}
.ribbon-mini{position:absolute;top:-6px;left:-6px;background:linear-gradient(135deg,#ff3b6b,#c72050);color:#fff;font-size:7px;font-weight:900;letter-spacing:1.5px;padding:2px 6px;border-radius:3px;z-index:5;box-shadow:0 2px 10px rgba(199,32,80,.5);white-space:nowrap}
.card-head{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border)}
.card-meta{flex:1;min-width:0}
.beer-name{font-size:17px;font-weight:900;line-height:1.1;letter-spacing:.3px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.beer-style{margin-top:4px;font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--amber);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:3px;padding:8px 12px;min-width:90px;text-align:center}
.status-pill .sp-label{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#050810;line-height:1}
.status-pill .sp-days{font-family:var(--font-display);font-size:17px;letter-spacing:1px;color:rgba(5,8,16,.80);line-height:1;margin-top:2px}
.status-pill.fermenting{background:var(--green);box-shadow:0 0 18px rgba(57,217,138,.30),inset 0 1px 0 rgba(255,255,255,.25);animation:ferment-glow 2.4s ease-in-out infinite}
@keyframes ferment-glow{0%,100%{box-shadow:0 0 14px rgba(57,217,138,.25)}50%{box-shadow:0 0 28px rgba(57,217,138,.50)}}
.status-pill.cooling{background:linear-gradient(160deg,var(--cool),var(--cool2));box-shadow:0 0 18px rgba(63,169,255,.30),inset 0 1px 0 rgba(255,255,255,.20);animation:cool-glow 2.4s ease-in-out infinite}
@keyframes cool-glow{0%,100%{box-shadow:0 0 14px rgba(63,169,255,.25)}50%{box-shadow:0 0 28px rgba(63,169,255,.50)}}
.status-pill.cooling .sp-label,.status-pill.cooling .sp-days{color:#fff}
.status-pill.ready{background:linear-gradient(160deg,#ffd166,#f0a500);box-shadow:0 0 22px rgba(255,200,80,.45);animation:ready-shake 1.1s ease-in-out infinite}
@keyframes ready-shake{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.card-body{padding:10px 16px 14px;flex:1}
.metrics{display:flex;align-items:center;gap:0;margin-bottom:10px}
.metric-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.metric-item:not(:last-child){border-right:1px solid var(--border)}
.metric-val{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text);line-height:1}
.metric-key{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.progress-labels{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;margin-bottom:5px}
.progress-track{position:relative;height:8px;border-radius:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);overflow:visible}
.progress-fill{height:100%;border-radius:1px;transition:width 1s cubic-bezier(.4,0,.2,1);position:relative;background:linear-gradient(90deg,#7bd3ff,#2b80ff)}
.progress-pct{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;font-family:var(--font-mono);color:rgba(255,255,255,.85);pointer-events:none;z-index:2}
.empty{margin:18px auto 0;max-width:720px;padding:18px 16px;border-radius:6px;border:1px dashed var(--border2);background:rgba(255,255,255,.03);color:var(--sub);text-align:center;line-height:1.5}
footer{flex:0 0 auto;height:32px;display:flex;align-items:center;justify-content:center;gap:20px;border-top:1px solid var(--border);background:rgba(5,8,15,.8);font-size:10px;font-weight:700;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
footer .f-dot{color:var(--amber)}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.10s}.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.20s}.card:nth-child(5){animation-delay:.25s}.card:nth-child(6){animation-delay:.30s}
@media(max-width:639px){
  html,body{overflow:auto;height:auto}
  .shell{height:auto;min-height:100svh}
  header{height:auto;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .h-brand{border-right:none;border-bottom:1px solid var(--border);padding:10px 16px;justify-content:space-between}
  .h-brand-left{gap:10px}
  .h-brand img{height:28px;max-width:120px}
  .brand-name{font-size:20px;letter-spacing:2px}
  .h-brand img{height:30px}
  .h-right-mobile{display:flex;border-left:none;padding:0;gap:8px}
  .h-right-desktop{display:none}
  .h-status-dot{width:6px;height:6px}
  .h-clock{font-size:12px}
  .h-date{font-size:9px}
  .h-center{gap:0;border-bottom:1px solid var(--border);border-top:1px solid var(--border);padding:8px 0;justify-content:space-evenly}
  .h-center .h-divider{display:none}
  .h-stat .sv{font-size:20px}
  .h-stat .sk{font-size:8px;letter-spacing:1px}
  .ticker{height:26px}
  .ticker-item{font-size:10px;gap:6px}
  main{flex:none;overflow:visible;padding:12px 12px 16px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card-head{padding:12px 12px 8px;gap:10px}
  .tank-no{font-size:34px;min-width:36px}
  .beer-name{font-size:15px}
  .card-body{padding:8px 12px 12px}
  .metric-val{font-size:13px}
  .status-pill{min-width:76px;padding:6px 8px}
  .status-pill .sp-label{font-size:10px}
  .status-pill .sp-days{font-size:14px}
  footer{height:auto;padding:10px 0;gap:10px;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="shell">
  <header>
    <div class="h-brand">
      <div class="h-brand-left">
        <img src="/logo.png" alt="时光酿造所 Logo" />
        <div class="brand-sub">Live Fermentation</div>
      </div>
      <div class="h-right h-right-mobile">
        <div class="h-status-dot"></div>
        <div>
          <div class="h-clock" id="clock-m">--:--:--</div>
          <div class="h-date" id="dateline-m"></div>
        </div>
      </div>
    </div>
    <div class="h-center">
      <div class="h-stat"><div class="sv" id="stat-active">—</div><div class="sk">发酵中</div></div>
      <div class="h-divider"></div>
      <div class="h-stat"><div class="sv" id="stat-cooling">—</div><div class="sk">降温冷沉</div></div>
      <div class="h-divider"></div>
      <div class="h-stat"><div class="sv" id="stat-ready">—</div><div class="sk">即将开罐</div></div>
      <div class="h-divider"></div>
      <div class="h-stat"><div class="sv" id="stat-total">—</div><div class="sk">罐组总计</div></div>
    </div>
    <div class="h-right h-right-desktop">
      <div class="h-status-dot"></div>
      <div>
        <div class="h-clock" id="clock">--:--:--</div>
        <div class="h-date" id="dateline"></div>
      </div>
    </div>
  </header>
  <div class="ticker"><div class="ticker-track" id="ticker-track"></div></div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      目前没有正在发酵的啤酒<br/>
      敬请期待下一批精彩 🍺
    </div>
  </main>
  <footer>
    <span>时光酿造所</span><span class="f-dot">✦</span>
    <span>CHRONOBREWERY</span><span class="f-dot">✦</span>
    <span>FERMENTATION MONITOR</span>
  </footer>
</div>
<script>
// === Data source ===
const LOAD_URL = "/api/public";
const POLL_MS  = 15000;

function pad2(n){return String(n).padStart(2,"0")}
function tickClock(){
  const d=new Date();
  const t=`${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  const dt=`${d.getFullYear()} / ${pad2(d.getMonth()+1)} / ${pad2(d.getDate())}`;
  ["clock","clock-m"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=t});
  ["dateline","dateline-m"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=dt});
}

function esc(s){
  return String(s ?? "").replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
}

function normBadge(it){
  const s=String(it?.badgeCN ?? "");
  if(s.includes("降温") && !s.includes("冷沉")) return "降温冷沉";
  return s || "--";
}

// ✅ 以“文案”为准强制分流：只要文案含“降温”，就一定走 cooling（即使后端 status 还是 ready）
function pillClass(badgeText,status){
  if(String(badgeText).includes("降温")) return "cooling";
  if(String(status||"").toLowerCase()==="ready") return "ready";
  return "fermenting";
}

function clampPct(x){
  const n = Number(x);
  if(!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(100, n));
}

function buildTicker(items){
  const track=document.getElementById("ticker-track");
  if(!track) return;
  const arr = Array.isArray(items) ? items : [];
  if(arr.length===0){
    track.innerHTML = `<span class="ticker-item"><span class="ti-dot">◆</span><span>暂无数据</span><span class="ti-dot">·</span><span class="ti-val">等待下一批发酵</span></span>`;
    return;
  }
  const s=arr.map(it=>`<span class="ticker-item"><span class="ti-dot">◆</span><span>${esc(it.no)} ${esc(it.beer)}</span><span class="ti-dot">·</span><span class="ti-val">${esc(it.style)}</span><span class="ti-dot">·</span><span class="ti-val">ABV ${esc(it.abv)} · IBU ${esc(it.ibu)}</span><span class="ti-dot">·</span><span class="ti-val">${esc(it.capacity)}</span></span>`);
  // 双份拼接用于滚动
  track.innerHTML=s.join("")+s.join("");
}

function updateStats(items){
  let a=0,c=0,r=0;
  (items||[]).forEach(it=>{
    const b=normBadge(it);
    const p=pillClass(b,it?.status);
    if(p==="cooling") c++;
    else if(p==="ready") r++;
    else a++;
  });
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=String(val)};
  set("stat-active",a);
  set("stat-cooling",c);
  set("stat-ready",r);
  set("stat-total",(items||[]).length);
}

function setEmpty(isEmpty){
  const empty = document.getElementById("empty");
  if(empty) empty.style.display = isEmpty ? "block" : "none";
}

function render(items){
  const grid=document.getElementById("grid");
  if(!grid) return;

  const arr = Array.isArray(items) ? items : [];
  grid.innerHTML="";

  updateStats(arr);
  buildTicker(arr);

  if(arr.length===0){
    setEmpty(true);
    return;
  }
  setEmpty(false);

  arr.forEach(it=>{
    const badge=normBadge(it);
    const pc=pillClass(badge,it?.status);
    const pct=clampPct(it?.progress);

    const card=document.createElement("div");
    card.className=`card status-${pc}`;
    card.innerHTML=`
      ${it?.limited?`<div class="ribbon">LIMITED</div>`:""}
      <div class="card-head">
        <div class="tank-wrap">
          <div class="tank-no">${esc(it?.no)}</div>
        </div>
        <div class="card-meta">
          <div class="beer-name" title="${esc(it?.beer)}">${esc(it?.beer)}</div>
          <div class="beer-style" title="${esc(it?.style)}">${esc(it?.style)}</div>
        </div>
        <div class="status-pill ${pc}">
          <div class="sp-label">${esc(badge)}</div>
          <div class="sp-days">${esc(it?.dayText)}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="metrics">
          <div class="metric-item"><div class="metric-val">${esc(it?.abv)}</div><div class="metric-key">ABV</div></div>
          <div class="metric-item"><div class="metric-val">${esc(it?.ibu)}</div><div class="metric-key">IBU</div></div>
          <div class="metric-item"><div class="metric-val">${esc(it?.capacity)}</div><div class="metric-key">容量</div></div>
          <div class="metric-item"><div class="metric-val">${esc(it?.temp)}</div><div class="metric-key">温度</div></div>
        </div>
        <div class="progress-section">
          <div class="progress-labels"><span>${esc(it?.start_md)}</span><span>${esc(it?.end_md)}</span></div>
          <div class="progress-track" aria-label="progress">
            <div class="progress-fill" style="width:${pct}%"></div>
            <div class="progress-pct">${pct}%</div>
          </div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

async function load(){
  // 页面不可见时不拉取，避免后台浪费
  if(document.visibilityState === "hidden") return;

  try{
    const res = await fetch(LOAD_URL, { cache:"no-store" });
    // 兼容后端偶发返回非 JSON
    const text = await res.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(_){ data = null; }

    if(!res.ok || (data && data.ok === false)){
      return render([]);
    }
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    render(items);
  }catch(_e){
    render([]);
  }
}

// init
tickClock();
setInterval(tickClock,1000);
load();
setInterval(load,POLL_MS);
</script>
</body>
</html>
