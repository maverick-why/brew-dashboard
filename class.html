<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>纪念杯认领 · 时光酿造所</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Serif SC',serif}

:root{
  --ink:#1C1610;
  --gold-mid:#C8972A;
  --gold-light:#D4A843;
  --gold-pale:#F0DFB0;
  --gold-bg:#FDF5E0;
  --cream:#F7F1E6;
  --cream-card:#FDFAF3;
  --cream-border:#E8DEC8;
  --ink-mute:#7A6E5A;
}

/* ── screen system ── */
.screens-wrap{position:fixed;inset:0;overflow:hidden}
.screens{display:flex;flex-direction:row;width:400%;height:100%;transition:transform .42s cubic-bezier(.32,.72,0,1)}
.screens.s1{transform:translateX(-25%)}
.screens.s2{transform:translateX(-50%)}
.screens.s3{transform:translateX(-75%)}
.screen{width:25%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ── Screen 0: Landing ── */
#s0{background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 64px;gap:0;text-align:center}
.lp-badge{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;color:rgba(240,223,176,.55);text-transform:uppercase;margin-bottom:28px}
.lp-cup{width:140px;height:auto;margin-bottom:32px;filter:drop-shadow(0 8px 24px rgba(200,151,42,.25))}
.lp-title{font-family:'Playfair Display',serif;font-size:clamp(26px,7vw,34px);font-weight:700;color:var(--cream);line-height:1.2;letter-spacing:.02em;margin-bottom:14px}
.lp-title em{font-style:italic;color:var(--gold-light)}
.lp-sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2.5px;color:rgba(240,223,176,.45);text-transform:uppercase;margin-bottom:40px}
.lp-divider{width:1px;height:32px;background:linear-gradient(to bottom,transparent,rgba(200,151,42,.4),transparent);margin:0 auto 40px}
.btn-cta{background:var(--gold-mid);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;letter-spacing:4px;padding:16px 48px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s;width:100%;max-width:300px}
.btn-cta:active{opacity:.8}
.btn-cta .arrow{font-size:18px}
.lp-footer{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(240,223,176,.2);text-transform:uppercase}

/* ── Screen 1: Verify ── */
#s1{background:var(--cream)}
.v-inner{padding:56px 28px 40px;max-width:480px;margin:0 auto}
.v-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-mute);cursor:pointer;margin-bottom:36px;background:none;border:none;font-family:inherit;letter-spacing:.5px}
.v-cup{width:64px;height:auto;margin-bottom:20px;opacity:.85}
.v-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:6px}
.v-sub{font-size:13px;color:var(--ink-mute);letter-spacing:.5px;margin-bottom:32px}
.v-input-wrap{position:relative;margin-bottom:12px}
.v-input{width:100%;padding:16px 18px;border:1.5px solid var(--cream-border);border-radius:14px;font-size:16px;font-family:'DM Mono',monospace;color:var(--ink);background:var(--cream-card);outline:none;transition:border-color .2s;letter-spacing:2px}
.v-input:focus{border-color:var(--gold-mid)}
.v-input::placeholder{color:rgba(28,22,16,.3);letter-spacing:1px;font-size:14px}
.v-hint{font-size:12px;color:var(--ink-mute);letter-spacing:.5px;margin-bottom:24px}
.btn-verify{width:100%;padding:15px;background:var(--ink);color:var(--cream);font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;letter-spacing:3px;border:none;border-radius:14px;cursor:pointer;transition:opacity .15s}
.btn-verify:active{opacity:.8}
.btn-verify:disabled{opacity:.45;cursor:not-allowed}
.v-msg{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:13px;letter-spacing:.5px;display:none}
.v-msg.error{display:block;background:#fff3f3;color:#c0392b;border:1px solid #fcd0d0}
.v-msg.info{display:block;background:var(--gold-bg);color:var(--ink);border:1px solid var(--gold-pale)}
.v-msg strong{display:block;font-size:16px;margin-bottom:4px}

/* ── Screen 2: Grid ── */
#s2{background:var(--cream)}
.grid-nav{background:var(--cream-card);border-bottom:1px solid var(--cream-border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.grid-nav-back{font-size:13px;color:var(--ink-mute);cursor:pointer;background:none;border:none;font-family:inherit;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.grid-nav-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px}
.grid-nav-ph{width:60px}
.stats-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:14px 20px;border-bottom:1px solid var(--cream-border);background:var(--cream-card)}
.stat-item{display:flex;align-items:baseline;gap:5px;padding:0 20px}
.stat-item:first-child{border-right:1px solid var(--cream-border)}
.stat-num{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;line-height:1;letter-spacing:1px}
.stat-item:first-child .stat-num{color:var(--ink-mute)}
.stat-item:last-child .stat-num{color:var(--gold-mid)}
.stat-label{font-size:11px;color:var(--ink-mute);letter-spacing:.5px}
.filter-bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--cream-border);background:var(--cream)}
.filter-btn{padding:6px 16px;border-radius:999px;font-size:12px;letter-spacing:1px;border:1.5px solid var(--cream-border);background:transparent;color:var(--ink-mute);cursor:pointer;font-family:'Noto Serif SC',serif;transition:all .15s}
.filter-btn.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.cup-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px 12px 80px}
.cup-cell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 4px;border-radius:12px;transition:background .15s;position:relative}
.cup-cell.available:active{background:var(--gold-bg)}
.cup-cell.claimed{cursor:default}
.cup-cell.hidden{display:none}
.cup-img{width:38px;height:auto}
.cup-cell.claimed .cup-img{filter:none}
.cup-cell.available .cup-img{filter:grayscale(1) opacity(.4)}
.cup-num{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.5px;color:var(--ink-mute)}
.cup-name{font-size:9px;color:var(--gold-mid);letter-spacing:.3px;text-align:center;line-height:1.2;max-width:52px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cup-cell.claimed .cup-num{color:var(--ink)}

/* ── bottom sheet modal ── */
.modal-mask{position:fixed;inset:0;background:rgba(28,22,16,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-mask.show{opacity:1;pointer-events:all}
.modal-sheet{background:var(--cream-card);border-radius:24px 24px 0 0;padding:28px 24px 48px;width:100%;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.modal-mask.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--cream-border);border-radius:2px;margin:0 auto 24px}
.modal-cup-row{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--cream-border)}
.modal-cup-img{width:52px;height:auto}
.modal-cup-info{}
.modal-cup-num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--ink);letter-spacing:2px}
.modal-cup-label{font-size:12px;color:var(--ink-mute);letter-spacing:1px;margin-top:2px}
.modal-name-label{font-size:13px;color:var(--ink);letter-spacing:.5px;margin-bottom:8px}
.modal-name-input{width:100%;padding:14px 16px;border:1.5px solid var(--cream-border);border-radius:12px;font-size:15px;font-family:'Noto Serif SC',serif;color:var(--ink);background:#fff;outline:none;transition:border-color .2s;margin-bottom:4px}
.modal-name-input:focus{border-color:var(--gold-mid)}
.modal-name-count{font-size:11px;color:var(--ink-mute);text-align:right;margin-bottom:20px}
.btn-claim{width:100%;padding:15px;background:var(--gold-mid);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;letter-spacing:3px;border:none;border-radius:14px;cursor:pointer;transition:opacity .15s}
.btn-claim:active{opacity:.8}
.btn-claim:disabled{opacity:.45;cursor:not-allowed}
.modal-err{margin-top:12px;font-size:13px;color:#c0392b;text-align:center;display:none}
.modal-err.show{display:block}

/* ── Screen 3: Success ── */
#s3{background:var(--cream)}
.suc-inner{padding:56px 28px 64px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.suc-cup{width:90px;height:auto;margin-bottom:24px}
.suc-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--ink-mute);text-transform:uppercase;margin-bottom:14px}
.suc-num{font-family:'DM Mono',monospace;font-size:48px;font-weight:500;color:var(--ink);letter-spacing:4px;line-height:1;margin-bottom:6px}
.suc-total{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink-mute);letter-spacing:2px;margin-bottom:28px}
.suc-divider{width:48px;height:1px;background:var(--gold-pale);margin:0 auto 24px}
.suc-card{width:100%;background:var(--cream-card);border:1px solid var(--cream-border);border-radius:20px;padding:24px;margin-bottom:32px}
.suc-row{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream-border);gap:12px}
.suc-row:last-child{border-bottom:none;padding-bottom:0}
.suc-row-label{font-size:12px;color:var(--ink-mute);letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.suc-row-val{font-size:13px;color:var(--ink);font-weight:600;letter-spacing:.5px;text-align:right}
.suc-notice{font-size:13px;color:var(--ink-mute);letter-spacing:.5px;line-height:1.7;margin-bottom:32px;padding:16px;background:var(--gold-bg);border-radius:12px;border:1px solid var(--gold-pale)}
.btn-back-grid{width:100%;padding:14px;background:transparent;color:var(--ink);font-family:'Noto Serif SC',serif;font-size:14px;letter-spacing:2px;border:1.5px solid var(--cream-border);border-radius:14px;cursor:pointer}
</style>
</head>
<body>

<div class="screens-wrap">
<div class="screens" id="screens">

<!-- ── Screen 0: Landing ── -->
<div class="screen" id="s0">
  <span class="lp-badge">限量 · 100 · Limited Edition</span>
  <img class="lp-cup" id="lpCup" alt="纪念杯"/>
  <h1 class="lp-title">认领一只<br><em>属于你的</em><br>纪念杯</h1>
  <p class="lp-sub">开业限量版 · 会员专属 · LIMITED 100</p>
  <div class="lp-divider"></div>
  <button class="btn-cta" onclick="goScreen(1)">
    <span>会员认领</span>
    <span class="arrow">→</span>
  </button>
  <div class="lp-footer">· 時光釀造所 · Timeless Brew ·</div>
</div>

<!-- ── Screen 1: Verify ── -->
<div class="screen" id="s1">
  <div class="v-inner">
    <button class="v-back" onclick="goScreen(0)">← 返回</button>
    <img class="v-cup" id="vCup" alt="纪念杯"/>
    <h2 class="v-title">验证会员身份</h2>
    <p class="v-sub">每个会员手机号限认领一只</p>
    <div class="v-input-wrap">
      <input class="v-input" id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="off"/>
    </div>
    <p class="v-hint">· 仅限已注册会员参与 ·</p>
    <button class="btn-verify" id="btnVerify" onclick="doVerify()">验证并选杯</button>
    <div class="v-msg" id="vMsg"></div>
  </div>
</div>

<!-- ── Screen 2: Grid ── -->
<div class="screen" id="s2">
  <div class="grid-nav">
    <button class="grid-nav-back" onclick="goScreen(1)">← 返回</button>
    <span class="grid-nav-title">选择你的杯</span>
    <div class="grid-nav-ph"></div>
  </div>
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-num" id="statClaimed">0</span>
      <span class="stat-label">已认领</span>
    </div>
    <div class="stat-item">
      <span class="stat-num" id="statAvail">100</span>
      <span class="stat-label">待认领</span>
    </div>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" data-filter="available" onclick="setFilter('available',this)">待认领</button>
    <button class="filter-btn" data-filter="claimed" onclick="setFilter('claimed',this)">已认领</button>
  </div>
  <div class="cup-grid" id="cupGrid"></div>
</div>

<!-- ── Screen 3: Success ── -->
<div class="screen" id="s3">
  <div class="suc-inner">
    <img class="suc-cup" id="sucCup" alt="纪念杯"/>
    <p class="suc-tag">认领成功</p>
    <div class="suc-num" id="sucNum">001</div>
    <div class="suc-total">/ 100</div>
    <div class="suc-divider"></div>
    <div class="suc-card">
      <div class="suc-row">
        <span class="suc-row-label">杯子编号</span>
        <span class="suc-row-val" id="sucNumVal">001</span>
      </div>
      <div class="suc-row">
        <span class="suc-row-label">认领人</span>
        <span class="suc-row-val" id="sucName">—</span>
      </div>
      <div class="suc-row">
        <span class="suc-row-label">手机号</span>
        <span class="suc-row-val" id="sucPhone">—</span>
      </div>
    </div>
    <div class="suc-notice">
      开业当日到店出示此页面，即可领取您的专属纪念杯
    </div>
    <button class="btn-back-grid" onclick="goScreen(2)">查看全部认领情况</button>
  </div>
</div>

</div><!-- /screens -->
</div><!-- /screens-wrap -->

<!-- ── Modal ── -->
<div class="modal-mask" id="modalMask" onclick="closeModal(event)">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-cup-row">
      <img class="modal-cup-img" id="modalCupImg" alt="纪念杯"/>
      <div class="modal-cup-info">
        <div class="modal-cup-num" id="modalCupNum">001</div>
        <div class="modal-cup-label">开业限量纪念杯</div>
      </div>
    </div>
    <p class="modal-name-label">你的姓名或昵称</p>
    <input class="modal-name-input" id="nameInput" type="text" maxlength="12" placeholder="最多 12 个字符" autocomplete="off"/>
    <p class="modal-name-count"><span id="nameCount">0</span> / 12</p>
    <button class="btn-claim" id="btnClaim" onclick="doClaim()">确认认领</button>
    <div class="modal-err" id="modalErr"></div>
  </div>
</div>

// ── State ──
let verifiedPhone = null;
let allCups = [];
let myClaimedCup = null;
let selectedCup = null;
let currentFilter = 'all';

// ── Init ──
document.querySelectorAll('#lpCup,#vCup,#modalCupImg,#sucCup').forEach(el => el.src = CUP_IMG);

// ── Navigation ──
function goScreen(n) {
  const sc = document.getElementById('screens');
  sc.className = 'screens' + (n > 0 ? ' s' + n : '');
  if (n === 2) loadCups();
}

// ── Phone input ──
const phoneInput = document.getElementById('phoneInput');
const btnVerify = document.getElementById('btnVerify');

phoneInput.addEventListener('input', () => {
  const val = phoneInput.value.replace(/\D/g, '').slice(0, 11);
  phoneInput.value = val;
  btnVerify.disabled = val.length !== 11;
  document.getElementById('vMsg').style.display = 'none';
});

phoneInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !btnVerify.disabled) doVerify();
});

btnVerify.disabled = true;

// ── Verify ──
async function doVerify() {
  const phone = phoneInput.value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    showVMsg('error', '请输入正确的手机号');
    return;
  }
  btnVerify.disabled = true;
  btnVerify.textContent = '验证中…';
  hideVMsg();

  try {
    const res = await fetch('/api/verify-member', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();

    if (data.valid) {
      verifiedPhone = phone;
      sessionStorage.setItem('cup_phone', phone);
      goScreen(2);
    } else if (data.reason === 'already_claimed') {
      verifiedPhone = phone;
      myClaimedCup = data.cup;
      showSuccess(data.cup.number, data.cup.claimer_name, phone);
      goScreen(3);
    } else {
      showVMsg('error', '该手机号暂无会员资格，欢迎到店开通');
    }
  } catch (e) {
    showVMsg('error', '网络错误，请重试');
  } finally {
    btnVerify.disabled = false;
    btnVerify.textContent = '验证并选杯';
  }
}

function showVMsg(type, html) {
  const el = document.getElementById('vMsg');
  el.className = 'v-msg ' + type;
  el.innerHTML = html;
}
function hideVMsg() {
  document.getElementById('vMsg').style.display = 'none';
}

// ── Load cups ──
async function loadCups() {
  try {
    const res = await fetch('/api/cups');
    allCups = await res.json();
    renderGrid();
    updateStats();
  } catch (e) {
    console.error('load cups failed', e);
  }
}

function updateStats() {
  const claimed = allCups.filter(c => c.claimed).length;
  document.getElementById('statClaimed').textContent = claimed;
  document.getElementById('statAvail').textContent = 100 - claimed;
}

function renderGrid() {
  const grid = document.getElementById('cupGrid');
  grid.innerHTML = '';
  allCups.forEach(cup => {
    const cell = document.createElement('div');
    const isClaimed = cup.claimed;
    const show = currentFilter === 'all'
      || (currentFilter === 'available' && !isClaimed)
      || (currentFilter === 'claimed' && isClaimed);
    cell.className = 'cup-cell ' + (isClaimed ? 'claimed' : 'available') + (show ? '' : ' hidden');

    cell.innerHTML = `
      <img class="cup-img" src="${CUP_IMG}" alt=""/>
      <span class="cup-num">${cup.number}</span>
      ${isClaimed ? `<span class="cup-name">${cup.claimer_name || ''}</span>` : ''}
    `;

    if (!isClaimed) {
      cell.addEventListener('click', () => openModal(cup));
    }
    grid.appendChild(cell);
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

// ── Modal ──
function openModal(cup) {
  selectedCup = cup;
  document.getElementById('modalCupNum').textContent = cup.number;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameCount').textContent = '0';
  document.getElementById('btnClaim').disabled = true;
  document.getElementById('modalErr').classList.remove('show');
  document.getElementById('modalMask').classList.add('show');
  setTimeout(() => document.getElementById('nameInput').focus(), 300);
}

function closeModal(e) {
  if (e.target === document.getElementById('modalMask')) {
    document.getElementById('modalMask').classList.remove('show');
    selectedCup = null;
  }
}

const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('input', () => {
  const val = [...nameInput.value].slice(0, 12).join('');
  nameInput.value = val;
  document.getElementById('nameCount').textContent = [...val].length;
  document.getElementById('btnClaim').disabled = [...val].length === 0;
  document.getElementById('modalErr').classList.remove('show');
});

// ── Claim ──
async function doClaim() {
  const name = nameInput.value.trim();
  if (!name) return;
  if (!verifiedPhone || !selectedCup) return;

  const btn = document.getElementById('btnClaim');
  btn.disabled = true;
  btn.textContent = '认领中…';
  document.getElementById('modalErr').classList.remove('show');

  try {
    const res = await fetch('/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: verifiedPhone, cup_id: selectedCup.id, claimer_name: name }),
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById('modalMask').classList.remove('show');
      // Update local state
      const idx = allCups.findIndex(c => c.id === selectedCup.id);
      if (idx !== -1) {
        allCups[idx].claimed = true;
        allCups[idx].claimer_name = name;
      }
      myClaimedCup = { number: data.cup.number, claimer_name: name };
      renderGrid();
      updateStats();
      showSuccess(data.cup.number, name, verifiedPhone);
      goScreen(3);
    } else {
      let msg = '认领失败，请重试';
      if (data.reason === 'cup_taken') msg = '这只杯子刚刚被人抢走了，请选择其他编号';
      if (data.reason === 'already_claimed') msg = '您已认领过一只纪念杯';
      if (data.reason === 'not_member') msg = '会员资格验证失败，请重新验证';
      showModalErr(msg);
    }
  } catch (e) {
    showModalErr('网络错误，请重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认认领';
  }
}

function showModalErr(msg) {
  const el = document.getElementById('modalErr');
  el.textContent = msg;
  el.classList.add('show');
}

// ── Success ──
function showSuccess(number, name, phone) {
  document.getElementById('sucNum').textContent = number;
  document.getElementById('sucNumVal').textContent = number;
  document.getElementById('sucName').textContent = name;
  const masked = phone.slice(0, 3) + '****' + phone.slice(7);
  document.getElementById('sucPhone').textContent = masked;
}
</script>
