<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>酒单 · 时光酿造所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Barlow+Condensed:wght@500;700&family=Bebas+Neue&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }

    html, body {
      width:100%; height:100%;
      background:#111;
      overflow:hidden;
    }

    /* ── 固定画布 1920×1080，JS 负责缩放 ── */
    :root {
      --bezel: 20px;  /* 电视边框宽度（像素），到货后量好改这一个值 */
      --gap: calc(var(--bezel) * 2); /* 卡片间距 = 2×bezel，与拼接缝视觉等宽 */
      --rs: 1;        /* row-scale：JS 根据行数动态设置，4行=1，5行=0.8，以此类推 */
    }

    #root {
      position: fixed;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      background: #1c1c1c;
      font-family: 'Noto Sans SC', sans-serif;
      padding: 0;
    }

    /* TV 第一页（左屏）：上左下留 bezel，右边贴边 */
    #root.tv-page-1 { padding: var(--bezel) 0 var(--bezel) var(--bezel); }

    /* TV 第二页（右屏）：上右下留 bezel，左边贴边 */
    #root.tv-page-2 { padding: var(--bezel) var(--bezel) var(--bezel) 0; }

    /* ── 卡片网格：2列×N行 ── */
    .grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      grid-auto-flow: column;
      gap: var(--gap);
    }

    /* ── 预览翻页按钮（浮动在真实视口底部，不在画布内） ── */
    .preview-nav {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
    }
    .preview-nav.show { display: flex }
    .nav-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 32px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.25) }
    .nav-label {
      color: rgba(255,255,255,.6);
      font-size: 18px;
      letter-spacing: 1px;
      min-width: 120px;
      text-align: center;
    }

    /* ── 卡片 ── */
    .card {
      background: #fff;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    /* 左侧彩色编号竖条 */
    .card-num {
      width: calc(96px * var(--rs));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* 已冠名：编号靠上，图标放大填满色块下半 */
    .card-num.sponsored {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: calc(14px * var(--rs));
      padding-bottom: calc(8px * var(--rs));
    }
    .card-num.sponsored .num {
      flex-shrink: 0;
      font-size: calc(44px * var(--rs));
    }
    .sponsor-tap-icon {
      flex: 1;           /* 填满编号以下的剩余高度 */
      width: 78%;        /* 宽度相对色块，留两侧呼吸 */
      min-height: 0;
      object-fit: contain;
      object-position: center bottom;  /* 贴底对齐，底部间隙由 padding-bottom 控制 */
    }
    .num {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: calc(72px * var(--rs));
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }

    /* 右侧内容 */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* 上半 */
    .row-top {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: calc(14px * var(--rs)) 20px max(10px, calc(10px * var(--rs))) 16px;
      gap: calc(12px * var(--rs));
    }
    .info-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .brewery-tag .flag {
      margin-left: 6px;
      margin-right: 0;
      font-style: normal;
    }
    .brewery-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 500;
      font-size: calc(30px * var(--rs));
      color: #666;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-name {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: calc(46px * var(--rs));
      color: #111;
      letter-spacing: 8px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .beer-style {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 400;
      font-size: calc(20px * var(--rs));
      color: #888;
      letter-spacing: 0.5px;
      white-space: nowrap;
      margin-top: calc(8px * var(--rs));
    }

    /* 特色标签（酒名右侧，上下排列） */
    .beer-name-row {
      display: flex;
      align-items: center;
      gap: calc(10px * var(--rs));
      min-width: 0;
    }
    .beer-tags {
      width: calc(160px * var(--rs));
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: calc(4px * var(--rs));
      /* 固定总高度 = 两个标签 + gap，让单标签也占同样空间 */
      min-height: calc((23px * 2 + 4px) * var(--rs));
    }
    /* 单标签：垂直居中，字号放大 */
    .beer-tags.single-tag .beer-tag {
      height: calc(28px * var(--rs));
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 calc(10px * var(--rs));
      font-size: calc(14px * var(--rs));
      font-weight: 600;
    }
    /* 双标签：正常高度 */
    .beer-tags.dual-tag .beer-tag {
      height: calc(23px * var(--rs));
      display: flex;
      align-items: center;
      padding: 0 calc(8px * var(--rs));
      font-size: calc(12px * var(--rs));
    }
    .beer-tag {
      border-radius: calc(4px * var(--rs));
      font-family: 'Noto Sans SC', sans-serif;
      font-size: calc(12px * var(--rs));
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
    }
    /* 🥇 金奖 */
    .beer-tag.award-gold {
      background: linear-gradient(135deg, #f9e79f, #f4d03f);
      border: 1px solid #d4af37;
      color: #7d6608;
    }
    /* 🥈 银奖 */
    .beer-tag.award-silver {
      background: linear-gradient(135deg, #e8e8e8, #d0d0d0);
      border: 1px solid #a8a8a8;
      color: #505050;
    }
    /* 🥉 铜奖 */
    .beer-tag.award-bronze {
      background: linear-gradient(135deg, #f5d5b8, #e0b088);
      border: 1px solid #cd7f32;
      color: #6b4423;
    }
    /* 酒花/原料特色（默认绿色） */
    .beer-tag.ingredient {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #2e7d32;
    }
    /* 💬 裁判评语（深色斜体） */
    .beer-tag.comment {
      background: #37474f;
      border: 1px solid #263238;
      color: #eceff1;
      font-style: italic;
      font-weight: 400;
      white-space: normal;   /* 允许换行 */
      line-height: 1.5;
      display: block;
    }
    .comment-tag-row {
      margin-top: calc(5px * var(--rs));
    }
    .card.special .beer-tag.ingredient {
      background: rgba(138,95,0,.08);
      border-color: rgba(138,95,0,.15);
      color: #8a5f00;
    }

    /* 价格 */
    .price-block {
      flex-shrink: 0;
      text-align: right;
    }
    .price-line {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: calc(41px * var(--rs));
      color: #222;
      line-height: 1.6;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .price-block.single .price-line {
      font-size: calc(52px * var(--rs));
      line-height: 1.3;
    }

    /* 分隔线 */
    .divider { height: 1px; background: #e0e0e0; margin: 0 16px }

    /* 下半 */
    .row-bottom {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: max(8px, calc(8px * var(--rs))) 20px calc(12px * var(--rs)) 16px;
      gap: calc(10px * var(--rs));
    }
    .comment-tags {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--rs));
      margin-left: calc(8px * var(--rs));
    }
    .info-en { flex: 1; min-width: 0; }
    /* 有冠名时 info-en 不撑满，让冠名文字 flex:1 填中间 */
    .row-bottom.has-sponsor .info-en { flex: 0 0 auto; max-width: 45%; }
    .alc-info {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 400;
      flex-shrink: 0;
      font-size: calc(39px * var(--rs));
      color: #aaa;
      text-align: right;
      white-space: nowrap;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }
    /* 冠名信息：单行，紧跟英文名右侧，往参数方向自然延伸 */
    .sponsor-inline {
      flex: 1;
      margin-left: calc(14px * var(--rs));
      align-self: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: calc(18px * var(--rs));
      line-height: 1;
    }
    .sponsor-inline .sp-prefix {
      color: #bbb;       /* 中灰：前缀"酒头冠名：" */
      font-weight: 400;
    }
    .sponsor-inline .sp-name {
      color: #666;       /* 深灰：冠名用户名，不抢主视觉 */
      font-weight: 500;
    }

    /* 售罄印章 */
    .sold-out-stamp {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      background: rgba(255,255,255,.45);
    }
    .stamp-inner {
      border: 6px solid #C8252A;
      border-radius: 8px;
      padding: 6px 22px;
      transform: rotate(-18deg);
      text-align: center;
      opacity: .88;
    }
    .stamp-cn {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: calc(52px * var(--rs));
      color: #C8252A;
      letter-spacing: 8px;
      line-height: 1.1;
    }
    .stamp-en {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: calc(22px * var(--rs));
      color: #C8252A;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* 空卡片 */
    .card.empty .beer-name { color: #ddd; font-size: calc(28px * var(--rs)); font-weight: 400 }

    /* ── 精选 special ── */
    .card.special { background: #fdf8f0; }
    .card.special .beer-name  { color: #8a5f00; }
    .card.special .price-line { color: #b07d00; }
    .card.special .divider    { background: #e8d8b0; }

    .trapez-badge {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(80px * var(--rs));
      background: linear-gradient(180deg, #f0c030 0%, #c8920a 100%);
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 38%, 0% 100%);
      z-index: 3;
    }
    .seal {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      width: calc(52px * var(--rs));
      height: calc(52px * var(--rs));
    }
    .seal-outer {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #f5d272, #c8920a);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.7),
        0 2px 8px rgba(0,0,0,.4),
        inset 0 1px 2px rgba(255,255,255,.4);
    }
    .seal-inner {
      position: absolute; inset: 5px;
      border-radius: 50%;
      border: 1.5px solid rgba(120,70,0,.3);
    }
    .seal-char {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      font-size: calc(20px * var(--rs));
      color: #5c3600;
      text-shadow: 0 1px 0 rgba(255,220,100,.6);
    }
    .seal-dot {
      position: absolute; width: 3px; height: 3px;
      border-radius: 50%; background: rgba(120,70,0,.3);
    }
    .seal-dot.t { top: 8px;    left: 50%; transform: translateX(-50%); }
    .seal-dot.b { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .seal-dot.l { left: 8px;   top: 50%;  transform: translateY(-50%); }
    .seal-dot.r { right: 8px;  top: 50%;  transform: translateY(-50%); }
    .card-num.has-badge .num { margin-top: calc(28px * var(--rs)); }

    /* 编号色块 */
    .c-yellow { background: #F5C400 }
    .c-red    { background: #C8252A }
    .c-orange { background: #E0621A }
    .c-dark   { background: #2B2B2B }
    .c-brown  { background: #5A3018 }
    .c-green  { background: #2E7D32 }
    .c-blue   { background: #1565C0 }
    .c-gray   { background: #C8C8C8 }
  </style>
</head>
<body>

<div id="root">
  <div class="grid" id="grid"></div>
</div>

<div class="preview-nav" id="previewNav">
  <button class="nav-btn" id="btnPrev">← 上一页</button>
  <div class="nav-label" id="navLabel">第 1 页 / 共 2 页</div>
  <button class="nav-btn" id="btnNext">下一页 →</button>
</div>

<script>
const API     = "/api/menu-public";
const REFRESH = 5000;

const DEFAULT_COLORS = [
  'yellow','red','orange','dark','yellow','orange','red','dark',
  'yellow','red','brown','yellow','dark','orange','yellow','dark'
];

// ?page=1 → 第1台显示器（左），?page=2 → 第2台显示器（右），无参数 → 预览翻页
const rawPage  = new URLSearchParams(location.search).get("page");
const IS_TV    = !!rawPage;
const TV_PAGE  = IS_TV ? parseInt(rawPage, 10) : 1;

// TV 模式：给 root 加边框 class
if (IS_TV) {
  document.getElementById("root").classList.add(`tv-page-${TV_PAGE}`);
}

let previewPage       = 1; // 预览模式当前页
let allItems          = [];
let currentItemsPerPage = 8; // 每台显示器显示的酒头数，由 tapCount 动态计算

// 预览模式显示翻页按钮
if (!IS_TV) {
  document.getElementById("previewNav").classList.add("show");
  document.getElementById("btnPrev").addEventListener("click", () => {
    if (previewPage > 1) { previewPage--; renderPreview(); }
  });
  document.getElementById("btnNext").addEventListener("click", () => {
    if (previewPage < 2) { previewPage++; renderPreview(); }
  });
}

function renderSlice(slice) {
  return slice.map(it => makeCard(it)).join("");
}

function renderPreview() {
  const offset = (previewPage - 1) * currentItemsPerPage;
  const slice  = allItems.slice(offset, offset + currentItemsPerPage);
  document.getElementById("grid").innerHTML = renderSlice(slice);
  document.getElementById("navLabel").textContent =
    `第 ${previewPage} 页 / 共 2 页`;
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

const SEAL_HTML = `
  <div class="trapez-badge"></div>
  <div class="seal">
    <div class="seal-outer"></div>
    <div class="seal-inner"></div>
    <div class="seal-dot t"></div>
    <div class="seal-dot b"></div>
    <div class="seal-dot l"></div>
    <div class="seal-dot r"></div>
    <div class="seal-char">荐</div>
  </div>`;

function makeCard(item) {
  const no    = String(item.no).padStart(2, "0");
  const color = item.color || DEFAULT_COLORS[item.no - 1] || "dark";
  const badge = item.special ? SEAL_HTML : "";

  const hasLarge = item.large_price && item.large_price.trim();
  const hasSmall = item.small_price && item.small_price.trim();
  const priceL = hasLarge
    ? `<div class="price-line">¥${esc(item.large_price)}${item.large_size ? " / "+esc(item.large_size) : ""}</div>` : "";
  const priceS = hasSmall
    ? `<div class="price-line">¥${esc(item.small_price)}${item.small_size ? " / "+esc(item.small_size) : ""}</div>` : "";
  const singlePrice = !!hasLarge !== !!hasSmall;

  const abvIbu = [
    item.abv ? `ALC ${esc(item.abv)}%` : "",
    item.ibu ? `IBU ${esc(item.ibu)}` : ""
  ].filter(Boolean).join("  ·  ");

  // 标签分流：💬 评语 → 下栏换行展示；其余 → 酒名右侧
  function getTagClass(text) {
    if (!text) return "ingredient";
    if (text.startsWith("🥇")) return "award-gold";
    if (text.startsWith("🥈")) return "award-silver";
    if (text.startsWith("🥉")) return "award-bronze";
    if (text.startsWith("💬")) return "comment";
    return "ingredient";
  }

  const allTags      = [item.tag1, item.tag2].filter(t => t && t.trim());
  const inlineTags   = allTags.filter(t => !t.startsWith("💬"));
  const commentTags  = allTags.filter(t =>  t.startsWith("💬"));

  const inlineTagClass = inlineTags.length === 1 ? "single-tag" : inlineTags.length === 2 ? "dual-tag" : "";
  const inlineTagsHtml  = inlineTags.map(t =>
    `<span class="beer-tag ${getTagClass(t)}">${esc(t)}</span>`
  ).join("");
  const commentTagsHtml = commentTags.map(t =>
    `<span class="beer-tag comment">${esc(t)}</span>`
  ).join("");

  const sponsored = item.sponsor_name && item.sponsor_name.trim();
  const sponsorIconHtml = sponsored
    ? `<img class="sponsor-tap-icon" src="/酒头.png" alt="酒头" />`
    : "";
  const sponsorInlineHtml = sponsored
    ? `<span class="sponsor-inline"><span class="sp-prefix">酒头冠名：</span><span class="sp-name">${esc(item.sponsor_name)}</span></span>`
    : "";

  return `
<div class="card${item.special ? " special" : ""}">
  ${item.sold_out ? `<div class="sold-out-stamp"><div class="stamp-inner"><div class="stamp-cn">售罄</div><div class="stamp-en">SOLD OUT</div></div></div>` : ""}
  <div class="card-num c-${esc(color)}${item.special ? " has-badge" : ""}${sponsored ? " sponsored" : ""}">
    ${badge}
    <span class="num">${no}</span>
    ${sponsorIconHtml}
  </div>
  <div class="card-body">
    <div class="row-top">
      <div class="info-left">
        <div class="brewery-tag">${esc(item.brewery)}<span class="flag">${esc(item.flag || "🇨🇳")}</span></div>
        <div class="beer-name-row">
          <div class="beer-name">${esc(item.name || item.name_en || "待上新")}</div>
          ${inlineTagsHtml ? `<div class="beer-tags ${inlineTagClass}">${inlineTagsHtml}</div>` : ""}
        </div>
        <div class="beer-style">${esc(item.style)}</div>
      </div>
      <div class="price-block${singlePrice ? " single" : ""}">${priceL}${priceS}</div>
    </div>
    <div class="divider"></div>
    <div class="row-bottom${sponsored ? " has-sponsor" : ""}">
      <div class="info-en">
        <div class="en-name">${esc(item.name_en)}</div>
        <div class="en-style">${esc(item.style_en)}</div>
      </div>
      ${commentTagsHtml ? `<div class="comment-tags">${commentTagsHtml}</div>` : ""}
      ${sponsorInlineHtml}
      <div class="alc-info">${abvIbu}</div>
    </div>
  </div>
</div>`;
}

async function load() {
  try {
    const res  = await fetch(API, { cache: "no-store" });
    const data = await res.json();
    if (!data.ok) return;

    // 根据管理员设置的酒头数动态计算行数和每页项目数
    // 4 个屏幕（2 台显示器 × 每台左右两列），每屏行数 = ceil(tapCount / 4)
    const tapCount        = Math.max(4, Math.min(64, Number(data.tapCount) || 16));
    const rows            = Math.ceil(tapCount / 4);
    currentItemsPerPage   = rows * 2;

    // 动态设置网格行数 & 字体缩放比例（基准：4行 = 1.0）
    document.getElementById("grid").style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    document.getElementById("root").style.setProperty("--rs", Math.min(1, 4 / rows));

    allItems = data.items.filter(it => it.name || it.name_en);

    if (IS_TV) {
      // TV 模式：直接渲染对应页（page=1 → 前半，page=2 → 后半）
      const offset = TV_PAGE === 2 ? currentItemsPerPage : 0;
      const slice  = allItems.slice(offset, offset + currentItemsPerPage);
      document.getElementById("grid").innerHTML = renderSlice(slice);
    } else {
      // 预览模式：翻页渲染
      renderPreview();
    }
  } catch(e) {
    console.warn("menu load error", e);
  }
}

// ── 缩放：将 1920×1080 的画布等比缩放铺满屏幕 ──
function scaleToFit() {
  const root   = document.getElementById("root");
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  const offsetX = (window.innerWidth  - 1920 * scale) / 2;
  const offsetY = (window.innerHeight - 1080 * scale) / 2;
  root.style.transform = `scale(${scale})`;
  root.style.left = offsetX + "px";
  root.style.top  = offsetY + "px";
}
window.addEventListener("resize", scaleToFit);
scaleToFit();

// ── 自动刷新 ──
let timer;
document.addEventListener("visibilitychange", () =>
  document.hidden ? clearInterval(timer) : (load(), timer = setInterval(load, REFRESH))
);
load();
timer = setInterval(load, REFRESH);
</script>
