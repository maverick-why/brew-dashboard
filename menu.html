<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>酒单 · 时光酿造所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Barlow+Condensed:wght@500;700&family=Bebas+Neue&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }

    html, body {
      width:100%; height:100%;
      background:#111;
      overflow:hidden;
    }

    /* ── 固定画布 1920×1080，JS 负责缩放 ── */
    :root {
      --bezel: 2px;   /* 实测1226×680mm面板，边框1.1mm ≈ 2px（0.639mm/px） */
      --gap: calc(var(--bezel) * 2); /* 卡片间距 = 2×bezel，与拼接缝视觉等宽 */
      --rs: 1;        /* row-scale：JS 根据行数动态设置，4行=1，5行=0.8，以此类推 */
      --tv-base-width: 1947px; /* 1226mm × 680mm 面板的 1080p 等比例基准宽度 */
    }

    #root {
      position: fixed;
      top: 0; left: 0;
      width: var(--tv-base-width);
      height: 1080px;
      transform-origin: top left;
      background: #1c1c1c;
      font-family: 'Noto Sans SC', sans-serif;
      padding: 0;
    }

    #root.dual-screen-left,
    #root.dual-screen-right,
    #root.tv-page-1,
    #root.tv-page-2,
    #root.tv-page-2-mid,
    #root.tv-page-3 {
      width: 100vw;
      height: 100vh;
    }

    #posterZone { display: none; }
    #funFactZone { display: none; }

    #root.dual-preview {
      width: calc(var(--tv-base-width) * 2);
      height: 1080px;
      padding: var(--dual-gap, var(--gap));
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: 1fr;   /* 同上：保证 poster-zone height:100% 正确解析 */
      gap: var(--dual-gap, var(--gap));
    }

    #root.dual-preview::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: rgba(255,255,255,.12);
      transform: translateX(-2px);
      pointer-events: none;
      z-index: 20;
    }

    #root.dual-preview #posterZone {
      display: block;
      grid-column: 1 / span 1;
      grid-row: 1;
    }

    #root.dual-preview .grid {
      grid-column: 2 / span 4;
      grid-row: 1;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--dual-gap, var(--gap));
    }

    #root.dual-preview #funFactZone {
      display: block;
      grid-column: 6;
      grid-row: 1;
    }

    /* 一键换位：活动海报区 ↔ 趣味数据榜，互换所在屏幕 */
    #root.dual-preview.zones-swapped #posterZone {
      grid-column: 6;
    }
    #root.dual-preview.zones-swapped #funFactZone {
      grid-column: 1 / span 1;
    }

    #root.dual-screen-left {
      padding: var(--dual-gap, var(--gap)) 0 var(--dual-gap, var(--gap)) var(--dual-gap, var(--gap));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr;   /* 让唯一行撑满全高，poster-zone height:100% 才能正确解析 */
      gap: var(--dual-gap, var(--gap));
    }

    #root.dual-screen-left #posterZone {
      display: block;
      grid-column: 1;
      grid-row: 1;
    }

    #root.dual-screen-left .grid {
      grid-column: 2 / span 2;
      grid-row: 1;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--dual-gap, var(--gap));
    }

    /* 一键换位：左屏改放趣味数据榜，隐藏活动海报区 */
    #root.dual-screen-left.zones-swapped #posterZone {
      display: none;
    }
    #root.dual-screen-left.zones-swapped #funFactZone {
      display: block;
      grid-column: 1;
      grid-row: 1;
    }

    #root.dual-screen-right {
      padding: var(--dual-gap, var(--gap)) var(--dual-gap, var(--gap)) var(--dual-gap, var(--gap)) 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr;   /* 让唯一行撑满全高，fun-fact-zone height:100% 才能正确解析 */
      gap: var(--dual-gap, var(--gap));
    }

    #root.dual-screen-right #funFactZone {
      display: block;
      grid-column: 3;
      grid-row: 1;
    }

    #root.dual-screen-right .grid {
      grid-column: 1 / span 2;
      grid-row: 1;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--dual-gap, var(--gap));
    }

    /* 一键换位：右屏改放活动海报区，隐藏趣味数据榜 */
    #root.dual-screen-right.zones-swapped #funFactZone {
      display: none;
    }
    #root.dual-screen-right.zones-swapped #posterZone {
      display: block;
      grid-column: 3;
      grid-row: 1;
    }

    /* ── 双屏卡片样式：适用于管理预览与实机TV双屏模式 ── */
    #root.dual-preview .card-num,
    #root.dual-screen-left .card-num,
    #root.dual-screen-right .card-num {
      width: calc(84px * var(--rs));
    }
    #root.dual-preview .num,
    #root.dual-screen-left .num,
    #root.dual-screen-right .num {
      font-size: calc(60px * var(--rs));
    }
    #root.dual-preview .row-top,
    #root.dual-screen-left .row-top,
    #root.dual-screen-right .row-top {
      flex: 1;
      padding: calc(12px * var(--rs)) calc(24px * var(--rs)) calc(8px * var(--rs)) calc(18px * var(--rs));
      gap: calc(10px * var(--rs));
      align-items: flex-start;
    }
    #root.dual-preview .info-left,
    #root.dual-screen-left .info-left,
    #root.dual-screen-right .info-left {
      align-self: stretch;
      justify-content: flex-start;  /* 酒厂名顶部固定不动 */
      /* 酒厂↔酒名↔风格 的间距改用各自的 margin-top 单独控制，见 .beer-name-row / .beer-style */
    }
    #root.dual-preview .brewery-tag,
    #root.dual-screen-left .brewery-tag,
    #root.dual-screen-right .brewery-tag {
      font-size: calc(23px * var(--rs));
      line-height: 1.02;
      color: #000;
    }
    #root.dual-preview .beer-name-row,
    #root.dual-screen-left .beer-name-row,
    #root.dual-screen-right .beer-name-row {
      margin-top: calc(6px * var(--rs));  /* 酒厂↔酒名 间距，比酒名↔风格小，抵消大字号的视觉膨胀 */
      width: 100%;
    }
    #root.dual-preview .beer-name,
    #root.dual-screen-left .beer-name,
    #root.dual-screen-right .beer-name {
      font-size: calc(33px * var(--rs));
      letter-spacing: calc(5px * var(--rs));
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    /* 标签列：独立放在 row-top 的 info-left 与 price-block 之间 */
    #root.dual-preview .beer-tags,
    #root.dual-screen-left .beer-tags,
    #root.dual-screen-right .beer-tags {
      flex: 0 0 auto;
      align-self: center;     /* 在 row-top 里垂直居中 */
      flex-direction: column; /* 上下排列 */
      align-items: flex-start;
      gap: calc(4px * var(--rs));
    }
    #root.dual-preview .beer-tag,
    #root.dual-screen-left .beer-tag,
    #root.dual-screen-right .beer-tag {
      height: calc(35px * var(--rs));
      max-width: calc(220px * var(--rs));
      padding: 0 calc(10px * var(--rs));
      font-size: calc(24px * var(--rs));
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 单标签时字号更大 */
    #root.dual-preview .beer-tag:only-child,
    #root.dual-screen-left .beer-tag:only-child,
    #root.dual-screen-right .beer-tag:only-child {
      height: calc(40px * var(--rs));
      font-size: calc(30px * var(--rs));
      max-width: calc(260px * var(--rs));
      padding: 0 calc(12px * var(--rs));
    }
    #root.dual-preview .beer-style,
    #root.dual-screen-left .beer-style,
    #root.dual-screen-right .beer-style {
      margin-top: calc(12px * var(--rs));  /* 酒名↔风格 间距 */
      font-size: calc(17px * var(--rs));
      line-height: 1.08;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #000;
    }
    #root.dual-preview .tap-day,
    #root.dual-screen-left .tap-day,
    #root.dual-screen-right .tap-day {
      margin-top: calc(4px * var(--rs));
      font-size: calc(14px * var(--rs));
      line-height: 1.08;
      color: #8a5f00;
    }
    #root.dual-preview .price-block,
    #root.dual-screen-left .price-block,
    #root.dual-screen-right .price-block {
      width: calc(210px * var(--rs));   /* 210px：单杯型"¥98/360ml"留足空间 */
      flex: 0 0 calc(210px * var(--rs));
      padding-right: calc(16px * var(--rs));
      margin-left: calc(8px * var(--rs));
      align-self: center;              /* 价格在上半区垂直居中 */
    }
    #root.dual-preview .price-line,
    #root.dual-screen-left .price-line,
    #root.dual-screen-right .price-line {
      font-size: calc(29px * var(--rs));
      line-height: 1.18;
    }
    #root.dual-preview .price-block.single .price-line,
    #root.dual-screen-left .price-block.single .price-line,
    #root.dual-screen-right .price-block.single .price-line {
      font-size: calc(35px * var(--rs));
      line-height: 1.04;
    }
    #root.dual-preview .divider,
    #root.dual-screen-left .divider,
    #root.dual-screen-right .divider {
      margin: calc(2px * var(--rs)) calc(18px * var(--rs)) 0;
    }
    #root.dual-preview .row-bottom,
    #root.dual-screen-left .row-bottom,
    #root.dual-screen-right .row-bottom {
      padding: calc(7px * var(--rs)) calc(18px * var(--rs)) calc(9px * var(--rs)) calc(18px * var(--rs));
      align-items: flex-end;
      gap: calc(4px * var(--rs));
    }
    #root.dual-preview .en-name,
    #root.dual-preview .en-style,
    #root.dual-screen-left .en-name,
    #root.dual-screen-left .en-style,
    #root.dual-screen-right .en-name,
    #root.dual-screen-right .en-style {
      font-size: calc(15px * var(--rs));
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #root.dual-preview .alc-info,
    #root.dual-screen-left .alc-info,
    #root.dual-screen-right .alc-info {
      width: calc(172px * var(--rs));
      flex: 0 0 calc(172px * var(--rs));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: calc(2px * var(--rs));
      padding-right: calc(8px * var(--rs));
      text-align: right;
    }
    #root.dual-preview .alc-line,
    #root.dual-screen-left .alc-line,
    #root.dual-screen-right .alc-line {
      font-size: calc(21px * var(--rs));
      line-height: 1;
      color: #000;
      letter-spacing: 0;
      white-space: nowrap;
    }
    #root.dual-preview .alc-tapday,
    #root.dual-screen-left .alc-tapday,
    #root.dual-screen-right .alc-tapday {
      font-size: calc(15px * var(--rs));
      line-height: 1.1;
      color: #8a5f00;
      white-space: nowrap;
    }
    #root.dual-preview .sold-out-stamp,
    #root.dual-screen-left .sold-out-stamp,
    #root.dual-screen-right .sold-out-stamp {
      top: auto; right: auto; bottom: auto; left: auto;
      top: 50%;
      left: 56%;
      transform: translate(-50%, -50%);
      width: auto;
      height: auto;
      background: transparent;
      justify-content: flex-start;
      align-items: flex-start;
    }
    #root.dual-preview .stamp-inner,
    #root.dual-screen-left .stamp-inner,
    #root.dual-screen-right .stamp-inner {
      border-width: calc(4px * var(--rs));
      border-radius: calc(6px * var(--rs));
      padding: calc(7px * var(--rs)) calc(18px * var(--rs));
      transform: rotate(-17deg);
      opacity: .86;
      background: rgba(255,255,255,.08);
    }
    #root.dual-preview .stamp-cn,
    #root.dual-screen-left .stamp-cn,
    #root.dual-screen-right .stamp-cn {
      font-size: calc(44px * var(--rs));
      letter-spacing: calc(5px * var(--rs));
      line-height: 1;
    }
    #root.dual-preview .stamp-en,
    #root.dual-screen-left .stamp-en,
    #root.dual-screen-right .stamp-en {
      font-size: calc(20px * var(--rs));
      letter-spacing: calc(3px * var(--rs));
    }
    #root.dual-preview .card.sold-out .brewery-tag,
    #root.dual-preview .card.sold-out .beer-name,
    #root.dual-preview .card.sold-out .beer-style,
    #root.dual-preview .card.sold-out .tap-day,
    #root.dual-preview .card.sold-out .en-name,
    #root.dual-preview .card.sold-out .en-style,
    #root.dual-preview .card.sold-out .price-line,
    #root.dual-preview .card.sold-out .alc-line,
    #root.dual-preview .card.sold-out .alc-tapday,
    #root.dual-screen-left .card.sold-out .brewery-tag,
    #root.dual-screen-left .card.sold-out .beer-name,
    #root.dual-screen-left .card.sold-out .beer-style,
    #root.dual-screen-left .card.sold-out .tap-day,
    #root.dual-screen-left .card.sold-out .en-name,
    #root.dual-screen-left .card.sold-out .en-style,
    #root.dual-screen-left .card.sold-out .price-line,
    #root.dual-screen-left .card.sold-out .alc-line,
    #root.dual-screen-left .card.sold-out .alc-tapday,
    #root.dual-screen-right .card.sold-out .brewery-tag,
    #root.dual-screen-right .card.sold-out .beer-name,
    #root.dual-screen-right .card.sold-out .beer-style,
    #root.dual-screen-right .card.sold-out .tap-day,
    #root.dual-screen-right .card.sold-out .en-name,
    #root.dual-screen-right .card.sold-out .en-style,
    #root.dual-screen-right .card.sold-out .price-line,
    #root.dual-screen-right .card.sold-out .alc-line,
    #root.dual-screen-right .card.sold-out .alc-tapday {
      color: #8a8a8a;
    }
    #root.dual-preview .card.sold-out .beer-tag.ingredient,
    #root.dual-screen-left .card.sold-out .beer-tag.ingredient,
    #root.dual-screen-right .card.sold-out .beer-tag.ingredient {
      background: #eef6ee;
      border-color: #c9ddca;
      color: #8db18f;
    }

    /* TV 左屏：上下留 bezel，左外边留 gap（= 卡片间距），右贴边（拼缝） */
    #root.tv-page-1 { padding: var(--bezel) 0 var(--bezel) var(--gap); }

    /* TV 中屏（三屏时）：上下留 bezel，左右贴边 */
    #root.tv-page-2-mid { padding: var(--bezel) 0 var(--bezel) 0; }

    /* TV 右屏：上下留 bezel，右外边留 gap（= 卡片间距），左贴边（拼缝） */
    #root.tv-page-2, #root.tv-page-3 { padding: var(--bezel) var(--gap) var(--bezel) 0; }

    /* ── 卡片网格：2列×N行 ── */
    .grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      grid-auto-flow: column;
      gap: var(--gap);
    }

    /* ── 预览翻页按钮（浮动在真实视口底部，不在画布内） ── */
    .preview-nav {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
    }
    .preview-nav.show { display: flex }
    .nav-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 32px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.25) }
    .nav-label {
      color: rgba(255,255,255,.6);
      font-size: 18px;
      letter-spacing: 1px;
      min-width: 120px;
      text-align: center;
    }

    /* ── 卡片 ── */
    .card {
      background: #e3e3e3;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    /* 左侧彩色编号竖条 */
    .card-num {
      width: calc(96px * var(--rs));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* 已冠名：编号靠上，图标放大填满色块下半 */
    .card-num.sponsored {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: calc(14px * var(--rs));
      padding-bottom: calc(8px * var(--rs));
    }
    .card-num.sponsored .num {
      flex-shrink: 0;
      font-size: calc(44px * var(--rs));
    }
    .sponsor-tap-icon {
      flex: 1;
      width: 78%;
      min-height: 0;
      object-fit: contain;
      object-position: center 30%;   /* 偏上，避免图标过低 */
    }
    .num {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: calc(72px * var(--rs));
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }

    /* 右侧内容 */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* 上半 */
    .row-top {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: calc(14px * var(--rs)) 20px max(10px, calc(10px * var(--rs))) 16px;
      gap: calc(12px * var(--rs));
    }
    .info-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .brewery-tag .flag {
      margin-left: 6px;
      margin-right: 0;
      font-style: normal;
    }
    .brewery-tag .flag::before {
      content: "· ";
    }
    .brewery-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 500;
      font-size: calc(30px * var(--rs));
      color: #666;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-name {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: calc(46px * var(--rs));
      color: #111;
      letter-spacing: 8px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .beer-style {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 400;
      font-size: calc(20px * var(--rs));
      color: #888;
      letter-spacing: 0.5px;
      white-space: nowrap;
      margin-top: calc(8px * var(--rs));
    }
    .tap-day {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      font-size: calc(18px * var(--rs));
      color: #b07d00;
      white-space: nowrap;
      margin-top: calc(4px * var(--rs));
    }

    /* 特色标签（酒名右侧，横排一行） */
    .beer-name-row {
      display: flex;
      align-items: center;
      gap: calc(10px * var(--rs));
      min-width: 0;
    }
    .beer-tags {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: calc(6px * var(--rs));
    }
    .beer-tag {
      border-radius: calc(4px * var(--rs));
      font-family: 'Noto Sans SC', sans-serif;
      font-size: calc(20px * var(--rs));
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      height: calc(32px * var(--rs));
      display: flex;
      align-items: center;
      padding: 0 calc(10px * var(--rs));
    }
    /* 🥇 金奖 */
    .beer-tag.award-gold {
      background: linear-gradient(135deg, #f9e79f, #f4d03f);
      border: 1px solid #d4af37;
      color: #7d6608;
    }
    /* 🥈 银奖 */
    .beer-tag.award-silver {
      background: linear-gradient(135deg, #e8e8e8, #d0d0d0);
      border: 1px solid #a8a8a8;
      color: #505050;
    }
    /* 🥉 铜奖 */
    .beer-tag.award-bronze {
      background: linear-gradient(135deg, #f5d5b8, #e0b088);
      border: 1px solid #cd7f32;
      color: #6b4423;
    }
    /* 酒花/原料特色（默认绿色） */
    .beer-tag.ingredient {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #2e7d32;
    }
    /* 💬 裁判评语（深色斜体） */
    .beer-tag.comment {
      background: #37474f;
      border: 1px solid #263238;
      color: #eceff1;
      font-style: italic;
      font-weight: 400;
      white-space: normal;   /* 允许换行 */
      line-height: 1.5;
      display: block;
    }
    .comment-tag-row {
      margin-top: calc(5px * var(--rs));
    }
    .card.special .beer-tag.ingredient {
      background: rgba(138,95,0,.08);
      border-color: rgba(138,95,0,.15);
      color: #8a5f00;
    }

    /* 价格 */
    .price-block {
      flex-shrink: 0;
      text-align: right;
    }
    .price-line {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: calc(41px * var(--rs));
      color: #222;
      line-height: 1.6;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .price-block.single .price-line {
      font-size: calc(52px * var(--rs));
      line-height: 1.3;
    }

    /* 分隔线 */
    .divider { height: 1px; background: #cacaca; margin: 0 16px }

    /* 下半 */
    .row-bottom {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: max(8px, calc(8px * var(--rs))) 20px calc(12px * var(--rs)) 16px;
      gap: calc(10px * var(--rs));
    }
    .comment-tags {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--rs));
      margin-left: calc(8px * var(--rs));
    }
    .info-en { flex: 1; min-width: 0; }
    /* 有冠名时：三块均匀分布 */
    .row-bottom.has-sponsor { justify-content: space-between; align-items: center; }
    .row-bottom.has-sponsor .info-en { flex: 0 0 auto; }
    .alc-info {
      flex-shrink: 0;
      align-self: center;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: calc(2px * var(--rs));
    }
    .alc-line {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 400;
      font-size: calc(39px * var(--rs));
      color: #aaa;
      white-space: nowrap;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }
    .alc-tapday {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 400;
      font-size: calc(22px * var(--rs));
      color: #b07d00;
      white-space: nowrap;
      letter-spacing: 0.3px;
      line-height: 1.05;
    }
    /* 冠名信息：居中列 */
    .sponsor-inline {
      flex: 0 0 auto;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: calc(30px * var(--rs));
      line-height: 1;
    }
    .sponsor-inline .sp-prefix {
      color: #000;
      font-weight: 400;
    }
    .sponsor-inline .sp-name {
      color: #666;
      font-weight: 500;
    }

    /* 售罄印章 */
    .sold-out-stamp {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      background: rgba(255,255,255,.45);
    }
    .stamp-inner {
      border: 6px solid #C8252A;
      border-radius: 8px;
      padding: 6px 22px;
      transform: rotate(-18deg);
      text-align: center;
      opacity: .88;
    }
    .stamp-cn {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: calc(52px * var(--rs));
      color: #C8252A;
      letter-spacing: 8px;
      line-height: 1.1;
    }
    .stamp-en {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: calc(22px * var(--rs));
      color: #C8252A;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* 空卡片 */
    .card.empty .beer-name { color: #c4c4c4; font-size: calc(28px * var(--rs)); font-weight: 400 }

    /* ── 活动动态区：双列 1280×1080 逻辑画布，随电视端缩放 ── */
    .poster-zone {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #101722;
      color: #fff;
      isolation: isolate;
    }
    .poster-bg-layer {
      position: absolute;
      top: -30px; right: -30px; bottom: -30px; left: -30px;
      background-image: var(--poster-image);
      background-size: cover;
      background-position: center;
      filter: blur(40px);
      opacity: .5;
      transform: scale(1.04);
      z-index: 0;
    }
    .poster-bg-layer::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,.28);
    }
    .poster-fg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    .poster-fg-layer img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: calc(100% - 80px);
      max-height: calc(100% - 80px);
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0,0,0,.35));
    }
    .poster-generated {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--poster-bg, linear-gradient(135deg, #143b28, #68a35d));
      overflow: hidden;
    }
    .poster-generated::before {
      content: "";
      position: absolute;
      top: 44px; right: 44px; bottom: 44px; left: 44px;
      border: 1px solid rgba(255,255,255,.18);
      pointer-events: none;
    }
    .poster-eyebrow {
      position: relative;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      letter-spacing: 8px;
      color: rgba(255,255,255,.68);
      text-transform: uppercase;
    }
    .poster-title {
      position: relative;
      margin-top: 28px;
      font-size: 92px;
      line-height: 1.05;
      letter-spacing: 8px;
      font-weight: 900;
      text-wrap: balance;
    }
    .poster-subtitle {
      position: relative;
      margin-top: 22px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
      color: rgba(255,255,255,.76);
    }
    .poster-body {
      position: relative;
      margin-top: 42px;
      max-width: 850px;
      font-size: 42px;
      line-height: 1.45;
      color: rgba(255,255,255,.9);
    }
    .poster-qr {
      position: relative;
      margin-top: 42px;
      width: 260px;
      height: 260px;
      object-fit: contain;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
    }
    .poster-default {
      background:
        radial-gradient(circle at 30% 24%, rgba(214,165,72,.25), transparent 32%),
        linear-gradient(135deg, #101722, #173725 55%, #101722);
    }

    /* ── 本店趣味数据榜：右屏最右侧，镜像左屏海报区，不轮播 ── */
    /* 便签墙风格：刻意跟酒单的深色表格感区分开，避免客人误认成菜单的一部分 */
    .fun-fact-zone {
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      background: #2b2620;
      color: #efe6d8;
    }
    .ff-header {
      flex: 0 0 auto;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #efe6d8;
      text-align: center;
      margin-bottom: 18px;
    }
    .ff-list {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .ff-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 12px 20px;
      border-radius: 4px;
      box-shadow: 3px 4px 0 rgba(0,0,0,.25);
    }
    .ff-list .ff-item:nth-child(4n+1) { transform: rotate(-2deg); }
    .ff-list .ff-item:nth-child(4n+2) { transform: rotate(1.5deg); }
    .ff-list .ff-item:nth-child(4n+3) { transform: rotate(-1deg); }
    .ff-list .ff-item:nth-child(4n+4) { transform: rotate(2deg); }
    .cat-sales  { background: #F4D35E; }
    .cat-member { background: #F4A6C6; }
    .cat-keg    { background: #8ECBFF; }
    .cat-staff  { background: #7FD8BE; }
    .ff-item.cat-sales  .ff-item-title, .ff-item.cat-sales  .ff-item-caption { color: #6b5410; }
    .ff-item.cat-member .ff-item-title, .ff-item.cat-member .ff-item-caption { color: #7a2f4c; }
    .ff-item.cat-keg    .ff-item-title, .ff-item.cat-keg    .ff-item-caption { color: #134a73; }
    .ff-item.cat-staff  .ff-item-title, .ff-item.cat-staff  .ff-item-caption { color: #0f5943; }
    .ff-item.cat-sales  .ff-item-value { color: #2b2210; }
    .ff-item.cat-member .ff-item-value { color: #3d1526; }
    .ff-item.cat-keg    .ff-item-value { color: #0d2e47; }
    .ff-item.cat-staff  .ff-item-value { color: #0a3d2f; }
    .ff-item-title {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ff-item-value {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      font-size: 48px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ff-item-caption {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 20px;
      line-height: 1.3;
      opacity: .75;
    }
    .ff-legend {
      flex: 0 0 auto;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 18px;
      color: rgba(239,230,216,.55);
      border-top: 1px solid rgba(239,230,216,.15);
      padding-top: 10px;
      margin-top: 16px;
    }
    .ff-legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 7px;
    }
    .ff-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(239,230,216,.5);
      font-size: 24px;
      text-align: center;
    }

    /* ── 精选 special：只改底色和文字颜色，不显示徽章 ── */
    .card.special { background: #fdf8f0; }
    .card.special .beer-name  { color: #8a5f00; }
    .card.special .price-line { color: #b07d00; }
    .card.special .divider    { background: #e8d8b0; }

    /* trapez-badge / seal 全部隐藏 */
    .trapez-badge, .seal { display: none; }

    /* 编号色块颜色由 JS 根据风格自动注入 inline style，此处无需定义 */
  </style>
</head>
<body>

<div id="root">
  <div class="grid" id="grid"></div>
  <div class="poster-zone" id="posterZone"></div>
  <div class="fun-fact-zone" id="funFactZone"></div>
</div>

<div class="preview-nav" id="previewNav">
  <button class="nav-btn" id="btnPrev">← 上一页</button>
  <div class="nav-label" id="navLabel">第 1 页 / 共 2 页</div>
  <button class="nav-btn" id="btnNext">下一页 →</button>
</div>

<script>
const API     = "/api/menu-public";
const POSTER_API = "/api/menu-public?poster=1";
const FUN_FACTS_API = "/api/menu-public?funfacts=1";
const REFRESH = 5000;

const STYLE_COLORS = [
  // 啤酒
  { keywords: ["ipa", "pale ale"],                         color: "#FDE9A0" },
  { keywords: ["lager", "拉格"],                            color: "#F9D84A" },
  { keywords: ["wheat", "小麦", "weiss", "白啤"],           color: "#E8C04A" },
  { keywords: ["porter", "波特", "stout", "世涛"],          color: "#5A3018" },
  { keywords: ["sour", "酸"],                               color: "#C8252A" },
  { keywords: ["saison", "赛松"],                           color: "#2E7D32" },
  { keywords: ["barleywine", "大麦酒"],                     color: "#6A1B9A" },
  { keywords: ["belgian", "比利时"],                        color: "#1565C0" },
  { keywords: ["ale", "艾尔"],                              color: "#F5C400" },
  // 鸡尾酒
  { keywords: ["cocktail", "鸡尾酒", "mojito", "莫吉托"],  color: "#00897B" },
  { keywords: ["whisky", "威士忌", "bourbon"],              color: "#8D4B00" },
  { keywords: ["gin", "金酒"],                              color: "#4A7C59" },
  { keywords: ["rum", "朗姆"],                              color: "#C47D00" },
  // 咖啡
  { keywords: ["coffee", "咖啡", "cold brew", "冷萃"],      color: "#4E342E" },
  { keywords: ["latte", "拿铁"],                            color: "#A1887F" },
  { keywords: ["espresso", "浓缩"],                         color: "#3E2723" },
  // 兜底
  { keywords: [],                                           color: "#2B2B2B" },
];

function getStyleColor(style, style_en) {
  const hay = ((style || "") + " " + (style_en || "")).toLowerCase();
  for (const entry of STYLE_COLORS) {
    if (entry.keywords.length === 0) return entry.color;
    if (entry.keywords.some(k => hay.includes(k.toLowerCase()))) return entry.color;
  }
  return "#2B2B2B";
}

// screen=left/right → 双屏电视物理屏幕；page=1/2/3 保留旧分页模式
const params   = new URLSearchParams(location.search);
const rawScreen = params.get("screen");
const TV_SCREEN = rawScreen === "left" || rawScreen === "right" ? rawScreen : "";
const rawPage  = params.get("page");
const IS_DUAL_SCREEN = !!TV_SCREEN;
const IS_TV    = !!rawPage || IS_DUAL_SCREEN;
const IS_DUAL_PREVIEW = !IS_TV;
const TV_PAGE  = rawPage ? parseInt(rawPage, 10) : 1;
const TV_VISIBLE_WIDTH_MM = 1226 - 2 * 1.1;
const TV_VISIBLE_HEIGHT_MM = 680 - 2 * 1.1;
const TV_ASPECT = TV_VISIBLE_WIDTH_MM / TV_VISIBLE_HEIGHT_MM;
const TV_BASE_WIDTH = Math.round(1080 * TV_ASPECT);
document.documentElement.style.setProperty("--tv-base-width", `${TV_BASE_WIDTH}px`);

let previewPage         = 1;
let allItems            = [];
let currentItemsPerPage = 8;
let screenCount         = 2; // 由 load() 根据 tapCount 动态更新
let posterItems         = [];
let posterIndex         = 0;
let posterTimer         = null;
let posterSignature     = "";

const LOCAL_PREVIEW_ITEMS = [
  ["时光酿造所","港岛妹妹","Hong Kong Sister","双倍浑浊IPA","Double Hazy IPA","来自香港的灵感","获奖配方升级","7.2","45","78","490ml","58","360ml"],
  ["时光酿造所","决心","Golden Hour Ale","金色艾尔","Golden Ale","致敬坚持的决心","2025香港家酿","5.0","18","78","490ml","58","360ml"],
  ["彼岸","阿达姆","Adam","古斯","Gose","芫荽柠檬","清爽易饮","4.0","35","66","490ml","59","360ml"],
  ["蔓延酿造","辛香农舍","Farmhouse Soul","塞松","Sour Saison","辛香草本","明亮酸感","4.6","40","66","490ml","60","360ml"],
  ["FEVER","谷仓铜琥","Amber Kellerbier","琥珀窖藏拉格","Amber Kellerbier","面包麦芽","德式骨架","5.0","35","64","400ml","",""],
  ["山丘","空知王牌","Sorachi Ace Hop Lager","日式酒花拉格","Japanese Hop Lager","北海道酒花","","4.5","8","66","400ml","",""],
  ["拾捌精酿","酒花逆流","Hops-upstream","双倍干投淡色艾尔","DDH Pale Ale","柑橘酒花","","5.5","35","66","490ml","58","360ml"],
  ["勿慕","夏令甜酿苹果酒西打","Summer Sweet","苹果西打","Apple Cider","苹果清甜","夏日易饮","7.0","2","68","490ml","",""],
  ["彼岸","夜曲波兰烟熏生啤","Nocturne","美式淡色艾尔","American Pale Ale","橡木烟熏","轻盈干爽","4.0","12","67","490ml","",""]
].map((row, index) => ({
  no: index + 1,
  brewery: row[0],
  name: row[1],
  name_en: row[2],
  style: row[3],
  style_en: row[4],
  tag1: row[5],
  tag2: row[6],
  abv: row[7],
  ibu: row[8],
  large_price: row[9],
  large_size: row[10],
  small_price: row[11],
  small_size: row[12],
  origin: "杭州",
  color: "dark",
  sold_out: false,
  special: false,
  sponsor_name: "",
}));

function localPreviewData() {
  const items = [];
  for (let i = 0; i < 27; i++) {
    items.push({ ...LOCAL_PREVIEW_ITEMS[i % LOCAL_PREVIEW_ITEMS.length], no: i + 1 });
  }
  return { ok: true, tapCount: 27, zonesSwapped: false, items };
}

// TV 模式：给 root 加边框 class（具体屏幕位置在 load() 里确认 screenCount 后再微调）
if (IS_DUAL_SCREEN) {
  document.getElementById("root").classList.add("dual-menu", `dual-screen-${TV_SCREEN}`);
} else if (IS_DUAL_PREVIEW) {
  document.getElementById("root").classList.add("dual-menu", "dual-preview");
} else if (IS_TV) {
  document.getElementById("root").classList.add(`tv-page-${TV_PAGE}`);
}

// 旧分页预览才显示翻页按钮；默认无参数用于双屏总预览
if (!IS_TV && !IS_DUAL_PREVIEW) {
  document.getElementById("previewNav").classList.add("show");
  document.getElementById("btnPrev").addEventListener("click", () => {
    if (previewPage > 1) { previewPage--; renderPreview(); }
  });
  document.getElementById("btnNext").addEventListener("click", () => {
    if (previewPage < screenCount) { previewPage++; renderPreview(); }
  });
}

function renderSlice(slice) {
  return slice.map(it => makeCard(it)).join("");
}

function renderPreview() {
  const offset = (previewPage - 1) * currentItemsPerPage;
  const slice  = allItems.slice(offset, offset + currentItemsPerPage);
  document.getElementById("grid").innerHTML = renderSlice(slice);
  document.getElementById("navLabel").textContent =
    `第 ${previewPage} 页 / 共 ${screenCount} 页`;
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function escAttr(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeCssValue(value) {
  return String(value || "")
    .replace(/[;{}<>]/g, "")
    .trim();
}

function posterImageStyle(url) {
  const safeUrl = String(url || "").replace(/["'()\\]/g, "");
  return `--poster-image:url('${escAttr(safeUrl)}')`;
}

function gradientFromColor(color) {
  const base = color && color !== "dark" ? color : "#173725";
  return `linear-gradient(135deg, #101722 0%, ${base} 54%, #0b1118 100%)`;
}

function renderPosterFallback() {
  return `
    <div class="poster-generated poster-default">
      <div class="poster-eyebrow">Chrono Brewery</div>
      <div class="poster-title">时光酿造所</div>
      <div class="poster-subtitle">Fresh Beer · Fresh Time</div>
    </div>`;
}

function renderImagePoster(item) {
  if (!item.imageUrl) return renderPosterFallback();
  return `
    <div class="poster-bg-layer" style="${posterImageStyle(item.imageUrl)}"></div>
    <div class="poster-fg-layer">
      <img src="${escAttr(item.imageUrl)}" alt="${escAttr(item.title || "动态海报")}"/>
    </div>`;
}

function renderBeerRecommend(item, menuItems) {
  const beer = menuItems.find(it => Number(it.no) === Number(item.tapNo)) || {};
  const themeColor = item.bgValue || getStyleColor(beer.style, beer.style_en);
  const bg = safeCssValue(item.bgValue || gradientFromColor(themeColor));
  const title = item.title || beer.name || beer.name_en || "今日推荐";
  const subtitle = [
    beer.brewery || "",
    beer.style || beer.style_en || "",
  ].filter(Boolean).join(" · ");
  const stats = [
    beer.abv ? `ALC ${esc(beer.abv)}%` : "",
    beer.ibu ? `IBU ${esc(beer.ibu)}` : "",
    beer.large_price ? `¥${esc(beer.large_price)}` : "",
  ].filter(Boolean).join(" · ");

  return `
    <div class="poster-generated" style="--poster-bg:${bg}">
      <div class="poster-eyebrow">今日推荐</div>
      <div class="poster-title">${esc(title)}</div>
      <div class="poster-subtitle">${esc(subtitle)}</div>
      <div class="poster-body">${stats || "Fresh On Tap"}</div>
    </div>`;
}

function infoCardLines(body) {
  if (!body || typeof body !== "object") return [];
  if (body.wifi) {
    return [
      `Wi-Fi：${body.wifi.ssid || ""}`,
      `密码：${body.wifi.pass || ""}`,
    ].filter(line => line.trim() !== "Wi-Fi：" && line.trim() !== "密码：");
  }
  if (Array.isArray(body.hours)) return body.hours;
  if (body.notice) return [body.notice];
  if (Array.isArray(body.lines)) return body.lines;
  return [];
}

function renderInfoCard(item) {
  const bg = item.bgType === "solid" && item.bgValue
    ? safeCssValue(item.bgValue)
    : item.bgType === "gradient" && item.bgValue
      ? safeCssValue(item.bgValue)
      : "linear-gradient(135deg, #101722, #173725 58%, #0b1118)";
  const lines = infoCardLines(item.body);

  return `
    <div class="poster-generated" style="--poster-bg:${bg}">
      <div class="poster-eyebrow">Info</div>
      <div class="poster-title">${esc(item.title || "店内信息")}</div>
      <div class="poster-body">${lines.map(line => `<div>${esc(line)}</div>`).join("")}</div>
      ${item.qrUrl ? `<img class="poster-qr" src="${escAttr(item.qrUrl)}" alt="二维码"/>` : ""}
    </div>`;
}

function renderPosterItem(item, menuItems) {
  if (!item) {
    document.getElementById("posterZone").innerHTML = renderPosterFallback();
    return;
  }

  if (item.type === "image") {
    document.getElementById("posterZone").innerHTML = renderImagePoster(item);
    return;
  }

  if (item.type === "beer_recommend") {
    document.getElementById("posterZone").innerHTML = renderBeerRecommend(item, menuItems);
    return;
  }

  document.getElementById("posterZone").innerHTML = renderInfoCard(item);
}

function startPosterLoop(menuItems) {
  clearTimeout(posterTimer);
  if (!posterItems.length) {
    renderPosterItem(null, menuItems);
    return;
  }

  const item = posterItems[posterIndex] || posterItems[0];
  renderPosterItem(item, menuItems);

  if (posterItems.length <= 1) return;
  const delay = Math.max(3, Number(item.durationSec) || 10) * 1000;
  posterTimer = setTimeout(() => {
    posterIndex = (posterIndex + 1) % posterItems.length;
    startPosterLoop(menuItems);
  }, delay);
}

async function loadPosterItems(menuItems, zonesSwapped) {
  const showsPoster = IS_DUAL_PREVIEW || (zonesSwapped ? TV_SCREEN === "right" : TV_SCREEN === "left");
  if (!showsPoster) return;

  try {
    const res = await fetch(POSTER_API, { cache: "no-store" });
    const data = await res.json();
    const items = data.ok && Array.isArray(data.items) ? data.items : [];
    const signature = JSON.stringify(items);
    if (signature === posterSignature) return;
    posterSignature = signature;
    posterItems = items;
    posterIndex = 0;
    startPosterLoop(menuItems);
  } catch {
    posterItems = [];
    posterSignature = "";
    startPosterLoop(menuItems);
  }
}

const FUN_FACT_CATEGORY_LABELS = { sales: "销售数据", member: "会员数据", keg: "清桶记录", staff: "店员观察" };
let funFactSignature = "";

const FUN_FACT_ZONE_MAX = 7;

function renderFunFactZone(rawItems) {
  const zone = document.getElementById("funFactZone");
  if (!zone) return;

  const items = rawItems.slice(0, FUN_FACT_ZONE_MAX);

  if (!items.length) {
    zone.innerHTML = `<div class="ff-header">本店趣味数据榜</div><div class="ff-empty">敬请期待</div>`;
    return;
  }

  const usedCategories = new Set(items.map(it => it.category));
  const list = items.map(it => `
    <div class="ff-item cat-${esc(it.category)}">
      <div class="ff-item-title">${esc(it.title)}</div>
      <div class="ff-item-value">${esc(it.value)}</div>
      ${it.caption ? `<div class="ff-item-caption">${esc(it.caption)}</div>` : ""}
    </div>`).join("");

  const legend = Object.keys(FUN_FACT_CATEGORY_LABELS)
    .filter(cat => usedCategories.has(cat))
    .map(cat => `<span><span class="ff-legend-dot cat-${cat}"></span>${esc(FUN_FACT_CATEGORY_LABELS[cat])}</span>`)
    .join("");

  zone.innerHTML = `
    <div class="ff-header">本店趣味数据榜</div>
    <div class="ff-list">${list}</div>
    <div class="ff-legend">${legend}</div>`;
}

async function loadFunFacts(zonesSwapped) {
  const showsFunFacts = IS_DUAL_PREVIEW || (zonesSwapped ? TV_SCREEN === "left" : TV_SCREEN === "right");
  if (!showsFunFacts) return;

  try {
    const res = await fetch(FUN_FACTS_API, { cache: "no-store" });
    const data = await res.json();
    const items = data.ok && Array.isArray(data.items) ? data.items : [];
    const signature = JSON.stringify(items);
    if (signature === funFactSignature) return;
    funFactSignature = signature;
    renderFunFactZone(items);
  } catch {
    renderFunFactZone([]);
  }
}

function renderDualLayout(items, tapCount) {
  // 左屏：活动区 1 列 + 酒牌 2 列；右屏：酒牌 2 列 + 趣味数据榜 1 列
  const LEFT_COLS  = 2;
  const RIGHT_COLS = 2;
  const TOTAL_COLS = LEFT_COLS + RIGHT_COLS; // 4 列酒牌

  const rows = Math.min(7, Math.max(3, Math.ceil(tapCount / TOTAL_COLS)));
  const root = document.getElementById("root");
  const grid = document.getElementById("grid");

  // TV 实机：按真实视口高度排版；预览保留固定 1080px 画布
  // 不做 Math.max(1080,…)：浏览器窗口有工具栏时 innerHeight 小于1080，
  // 强制1080会导致卡片总高溢出、alignContent:center把溢出均分到上下，顶部被截断
  const layoutHeight = IS_DUAL_PREVIEW
    ? 1080
    : Math.floor(window.innerHeight || 1080);
  const layoutScale  = layoutHeight / 1080;
  // 实机：1.1mm bezel ≈ 2px（1226mm/1920px ≈ 0.639mm/px）；预览留 40px 设计留白
  const screenPad = IS_DUAL_PREVIEW ? 40 : 2;
  const cardGap   = IS_DUAL_PREVIEW ? Math.max(8, Math.round(8 * layoutScale)) : 8;
  const availH    = layoutHeight - 2 * screenPad;
  const cardH     = Math.floor((availH - (rows - 1) * cardGap) / rows);
  // refH=190 使 6 行（≈172px）时 rs≈0.9，字号清晰；上限 1.1 防行数极少时溢出
  const refH      = 190;

  root.style.setProperty("--dual-gap", `${screenPad}px`);
  root.style.setProperty("--rs", Math.min(1.1, Math.max(0.52, cardH / refH)));
  // TV 浏览器 height:100% 不能从 grid 1fr 行继承，显式设置 posterZone / funFactZone 高度
  const posterZone = document.getElementById("posterZone");
  if (posterZone) posterZone.style.height = `${availH}px`;
  const funFactZone = document.getElementById("funFactZone");
  if (funFactZone) funFactZone.style.height = `${availH}px`;
  grid.style.gridTemplateRows = `repeat(${rows}, ${cardH}px)`;
  grid.style.gap              = `${cardGap}px`;
  grid.style.alignContent     = "center";  // 行数不足时垂直居中，余量留黑

  if (IS_DUAL_PREVIEW) {
    grid.style.gridTemplateColumns = `repeat(${TOTAL_COLS}, 1fr)`;
    grid.innerHTML = renderSlice(items.slice(0, rows * TOTAL_COLS));
    return;
  }

  if (TV_SCREEN === "left") {
    grid.style.gridTemplateColumns = `repeat(${LEFT_COLS}, 1fr)`;
    grid.innerHTML = renderSlice(items.slice(0, rows * LEFT_COLS));
    return;
  }

  // 右屏
  grid.style.gridTemplateColumns = `repeat(${RIGHT_COLS}, 1fr)`;
  grid.innerHTML = renderSlice(items.slice(rows * LEFT_COLS, rows * TOTAL_COLS));
}

const SEAL_HTML = `
  <div class="trapez-badge"></div>
  <div class="seal">
    <div class="seal-outer"></div>
    <div class="seal-inner"></div>
    <div class="seal-dot t"></div>
    <div class="seal-dot b"></div>
    <div class="seal-dot l"></div>
    <div class="seal-dot r"></div>
    <div class="seal-char">荐</div>
  </div>`;

function makeCard(item) {
  const no         = String(item.no).padStart(2, "0");
  const blockColor = getStyleColor(item.style, item.style_en);
  const badge      = item.special ? SEAL_HTML : "";

  const hasLarge = item.large_price && item.large_price.trim();
  const hasSmall = item.small_price && item.small_price.trim();
  const priceL = hasLarge
    ? `<div class="price-line">¥${esc(item.large_price)}${item.large_size ? " / "+esc(item.large_size) : ""}</div>` : "";
  const priceS = hasSmall
    ? `<div class="price-line">¥${esc(item.small_price)}${item.small_size ? " / "+esc(item.small_size) : ""}</div>` : "";
  const singlePrice = !!hasLarge !== !!hasSmall;

  const abvIbu = [
    item.abv ? `ALC ${esc(item.abv)}%` : "",
    item.ibu ? `IBU ${esc(item.ibu)}` : ""
  ].filter(Boolean).join("  ·  ");
  const tapDayEn = (item.tapDay !== null && item.tapDay !== undefined) ? `On Tap Day ${item.tapDay}` : "";

  // 标签分流：💬 评语 → 下栏换行展示；其余 → 酒名右侧
  function getTagClass(text) {
    if (!text) return "ingredient";
    if (text.startsWith("🥇")) return "award-gold";
    if (text.startsWith("🥈")) return "award-silver";
    if (text.startsWith("🥉")) return "award-bronze";
    if (text.startsWith("💬")) return "comment";
    return "ingredient";
  }

  const allTags      = [item.tag1, item.tag2].filter(t => t && t.trim());
  const inlineTags   = allTags.filter(t => !t.startsWith("💬"));
  const commentTags  = allTags.filter(t =>  t.startsWith("💬"));

  const inlineTagsHtml  = inlineTags.map(t =>
    `<span class="beer-tag ${getTagClass(t)}">${esc(t)}</span>`
  ).join("");
  const commentTagsHtml = commentTags.map(t =>
    `<span class="beer-tag comment">${esc(t)}</span>`
  ).join("");

  const sponsored = item.sponsor_name && item.sponsor_name.trim();
  const sponsorIconHtml = sponsored
    ? `<img class="sponsor-tap-icon" src="/jiu-tou.png" alt="酒头" />`
    : "";
  const sponsorInlineHtml = sponsored
    ? `<span class="sponsor-inline"><span class="sp-prefix">酒头冠名：</span><span class="sp-name">${esc(item.sponsor_name)}</span></span>`
    : "";

  return `
<div class="card${item.special ? " special" : ""}${item.sold_out ? " sold-out" : ""}">
  ${item.sold_out ? `<div class="sold-out-stamp"><div class="stamp-inner"><div class="stamp-cn">售罄</div><div class="stamp-en">SOLD OUT</div></div></div>` : ""}
  <div class="card-num${sponsored ? " sponsored" : ""}" style="background:${blockColor}">
    ${badge}
    <span class="num">${no}</span>
    ${sponsorIconHtml}
  </div>
  <div class="card-body">
    <div class="row-top">
      <div class="info-left">
        <div class="brewery-tag">${esc(item.brewery)}${item.origin ? `<span class="flag">${esc(item.origin)}</span>` : ""}</div>
        <div class="beer-name-row">
          <div class="beer-name">${esc(item.name || item.name_en || "待上新")}</div>
        </div>
        <div class="beer-style">${esc(item.style)}</div>
        ${(item.tapDay !== null && item.tapDay !== undefined) ? `<div class="tap-day">上枪时间 Day ${item.tapDay}</div>` : ""}
      </div>
      ${inlineTagsHtml ? `<div class="beer-tags">${inlineTagsHtml}</div>` : ""}
      <div class="price-block${singlePrice ? " single" : ""}">${priceL}${priceS}</div>
    </div>
    <div class="divider"></div>
    <div class="row-bottom${sponsored ? " has-sponsor" : ""}">
      <div class="info-en">
        <div class="en-name">${esc(item.name_en)}</div>
        <div class="en-style">${esc(item.style_en)}</div>
      </div>
      ${commentTagsHtml ? `<div class="comment-tags">${commentTagsHtml}</div>` : ""}
      ${sponsorInlineHtml}
      <div class="alc-info">
        ${abvIbu ? `<div class="alc-line">${abvIbu}</div>` : ""}
        ${tapDayEn ? `<div class="alc-tapday">${tapDayEn}</div>` : ""}
      </div>
    </div>
  </div>
</div>`;
}

async function load() {
  try {
    let data;
    if (location.protocol === "file:") {
      data = localPreviewData();
    } else {
      const res  = await fetch(API, { cache: "no-store" });
      data = await res.json();
    }
    if (!data.ok) return;
    const tapCount = Math.max(4, Math.min(64, Number(data.tapCount) || 16));

    // 双屏模式：
    // 总画布 6 列：1 活动区，2-3 左屏酒单，4-5 右屏酒单，6 趣味数据榜
    // left  屏：活动区 1 列 + 酒单 2 列
    // right 屏：酒单 2 列 + 趣味数据榜 1 列
    // 后台开关可一键互换活动区 / 趣味数据榜所在屏幕（zonesSwapped）
    if (IS_DUAL_SCREEN || IS_DUAL_PREVIEW) {
      const zonesSwapped = !!data.zonesSwapped;
      document.getElementById("root").classList.toggle("zones-swapped", zonesSwapped);
      allItems = (data.items || []).filter(it => it.name || it.name_en);
      renderDualLayout(allItems, tapCount);
      await loadPosterItems(allItems, zonesSwapped);
      await loadFunFacts(zonesSwapped);
      return;
    }

    // 旧 page 模式：根据酒头数决定屏幕数，>20 启用第三屏，否则两屏
    screenCount         = tapCount > 20 ? 3 : 2;
    const totalCols     = screenCount * 2;           // 每页2列
    const rows          = Math.min(5, Math.ceil(tapCount / totalCols));
    currentItemsPerPage = rows * 2;

    // 三屏中间屏：page=2 时改 class 为 tv-page-2-mid
    if (IS_TV && screenCount === 3 && TV_PAGE === 2) {
      const root = document.getElementById("root");
      root.classList.remove("tv-page-2");
      root.classList.add("tv-page-2-mid");
    }

    // 动态设置网格行数 & 字体缩放比例（基准：4行 = 1.0）
    document.getElementById("grid").style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    document.getElementById("root").style.setProperty("--rs", Math.min(1, 4 / rows));

    allItems = data.items.filter(it => it.name || it.name_en);

    if (IS_TV) {
      // TV 模式：按页码直接渲染对应区段
      const offset = (TV_PAGE - 1) * currentItemsPerPage;
      const slice  = allItems.slice(offset, offset + currentItemsPerPage);
      document.getElementById("grid").innerHTML = renderSlice(slice);
    } else {
      // 预览模式：翻页渲染
      renderPreview();
    }
  } catch(e) {
    console.warn("menu load error", e);
    const data = localPreviewData();
    const tapCount = data.tapCount;
    allItems = data.items;
    if (IS_DUAL_SCREEN || IS_DUAL_PREVIEW) {
      document.getElementById("root").classList.remove("zones-swapped");
      renderDualLayout(allItems, tapCount);
      if (TV_SCREEN === "left" || IS_DUAL_PREVIEW) renderPosterItem(null, allItems);
      if (TV_SCREEN === "right" || IS_DUAL_PREVIEW) renderFunFactZone([]);
      return;
    }
    screenCount = 2;
    const rows = Math.min(5, Math.ceil(tapCount / 4));
    currentItemsPerPage = rows * 2;
    document.getElementById("grid").style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    document.getElementById("root").style.setProperty("--rs", Math.min(1, 4 / rows));
    renderPreview();
  }
}

// ── 缩放：将固定画布等比缩放铺满屏幕 ──
function scaleToFit() {
  const root   = document.getElementById("root");
  if (IS_DUAL_SCREEN || IS_TV) {
    root.style.transform = "none";
    root.style.left = "0px";
    root.style.top  = "0px";
    return;
  }
  const canvasWidth = IS_DUAL_PREVIEW ? TV_BASE_WIDTH * 2 : TV_BASE_WIDTH;
  const scaleX = window.innerWidth  / canvasWidth;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  const offsetX = (window.innerWidth  - canvasWidth * scale) / 2;
  const offsetY = (window.innerHeight - 1080 * scale) / 2;
  root.style.transform = `scale(${scale})`;
  root.style.left = offsetX + "px";
  root.style.top  = offsetY + "px";
}
window.addEventListener("resize", scaleToFit);
scaleToFit();

// ── 自动刷新 ──
let timer;
document.addEventListener("visibilitychange", () =>
  document.hidden ? clearInterval(timer) : (load(), timer = setInterval(load, REFRESH))
);
load();
timer = setInterval(load, REFRESH);
</script>
