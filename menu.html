<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>酒单 · 时光酿造所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Barlow+Condensed:wght@500;700&family=Bebas+Neue&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }

    html, body {
      width:100%; height:100%;
      background:#111;
      overflow:hidden;
    }

    /* ── 固定画布 1920×1080，JS 负责缩放 ── */
    :root {
      --bezel: 20px;  /* 电视边框宽度（像素），到货后量好改这一个值 */
      --gap: calc(var(--bezel) * 2); /* 卡片间距 = 2×bezel，与拼接缝视觉等宽 */
    }

    #root {
      position: fixed;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      background: #1c1c1c;
      font-family: 'Noto Sans SC', sans-serif;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    /* TV 第一页（左屏）：上左下留 bezel，右边贴边 */
    #root.tv-page-1 { padding: var(--bezel) 0 var(--bezel) var(--bezel); }

    /* TV 第二页（右屏）：上右下留 bezel，左边贴边 */
    #root.tv-page-2 { padding: var(--bezel) var(--bezel) var(--bezel) 0; }

    /* ── 卡片网格：2列×4行 ── */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap: var(--gap);
    }

    /* ── 预览翻页按钮 ── */
    .preview-nav {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 10px 0 4px;
    }
    .preview-nav.show { display: flex }
    .nav-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 32px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.25) }
    .nav-label {
      color: rgba(255,255,255,.6);
      font-size: 18px;
      letter-spacing: 1px;
      min-width: 120px;
      text-align: center;
    }

    /* ── 卡片 ── */
    .card {
      background: #fff;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    /* 左侧彩色编号竖条 */
    .card-num {
      width: 84px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: 72px;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }

    /* 右侧内容 */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* 上半 */
    .row-top {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 14px 20px 10px 16px;
      gap: 12px;
    }
    .info-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .brewery-tag .flag {
      margin-left: 6px;
      margin-right: 0;
      font-style: normal;
    }
    .brewery-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 500;
      font-size: 30px;
      color: #666;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-name {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: 46px;
      color: #111;
      letter-spacing: 8px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-style {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 400;
      font-size: 20px;
      color: #888;
      letter-spacing: 0.5px;
      white-space: nowrap;
      margin-top: 8px;
    }

    /* 价格 */
    .price-block {
      flex-shrink: 0;
      text-align: right;
    }
    .price-line {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 41px;
      color: #222;
      line-height: 1.6;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* 分隔线 */
    .divider { height: 1px; background: #e0e0e0; margin: 0 16px }

    /* 下半 */
    .row-bottom {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      padding: 8px 20px 12px 16px;
      gap: 12px;
    }
    .info-en { flex: 1; min-width: 0 }
    .en-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #444;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.05;
    }
    .en-style {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 500;
      font-size: 20px;
      color: #999;
      letter-spacing: 0.5px;
      white-space: nowrap;
      line-height: 1.05;
    }
    .alc-info {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 400;
      flex-shrink: 0;
      font-size: 39px;
      color: #aaa;
      text-align: right;
      white-space: nowrap;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }

    /* 空卡片 */
    .card.empty .beer-name { color: #ddd; font-size: 28px; font-weight: 400 }

    /* 编号色块 */
    .c-yellow { background: #F5C400 }
    .c-red    { background: #C8252A }
    .c-orange { background: #E0621A }
    .c-dark   { background: #2B2B2B }
    .c-brown  { background: #5A3018 }
    .c-green  { background: #2E7D32 }
    .c-blue   { background: #1565C0 }
    .c-gray   { background: #C8C8C8 }
  </style>
</head>
<body>

<div id="root">
  <div class="grid" id="grid"></div>
  <div class="preview-nav" id="previewNav">
    <button class="nav-btn" id="btnPrev">← 上一页</button>
    <div class="nav-label" id="navLabel">第 1 页 / 共 2 页</div>
    <button class="nav-btn" id="btnNext">下一页 →</button>
  </div>
</div>

<script>
const API     = "/api/menu-public";
const REFRESH = 30000;

const DEFAULT_COLORS = [
  'yellow','red','orange','dark','yellow','orange','red','dark',
  'yellow','red','brown','yellow','dark','orange','yellow','dark'
];

// ?page=1 → 第1-8 TV模式，?page=2 → 第9-16 TV模式，无参数 → 预览翻页
const rawPage  = new URLSearchParams(location.search).get("page");
const IS_TV    = !!rawPage;
const TV_PAGE  = IS_TV ? parseInt(rawPage, 10) : 1;
const TV_OFFSET = TV_PAGE === 2 ? 8 : 0;

// TV 模式：给 root 加边框 class
if (IS_TV) {
  document.getElementById("root").classList.add(`tv-page-${TV_PAGE}`);
}

let previewPage = 1; // 预览模式当前页
let allItems    = [];

// 预览模式显示翻页按钮
if (!IS_TV) {
  document.getElementById("previewNav").classList.add("show");
  document.getElementById("btnPrev").addEventListener("click", () => {
    if (previewPage > 1) { previewPage--; renderPreview(); }
  });
  document.getElementById("btnNext").addEventListener("click", () => {
    if (previewPage < 2) { previewPage++; renderPreview(); }
  });
}

function renderSlice(slice) {
  return slice.map(it => makeCard(it)).join("");
}

function renderPreview() {
  const offset = (previewPage - 1) * 8;
  const slice  = allItems.slice(offset, offset + 8);
  document.getElementById("grid").innerHTML = renderSlice(slice);
  document.getElementById("navLabel").textContent =
    `第 ${previewPage} 页 / 共 2 页`;
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function makeCard(item) {
  const no    = String(item.no).padStart(2, "0");
  const color = item.color || DEFAULT_COLORS[item.no - 1] || "dark";

  const priceL = item.large_price
    ? `<div class="price-line">¥${esc(item.large_price)}${item.large_size ? " / "+esc(item.large_size) : ""}</div>` : "";
  const priceS = item.small_price
    ? `<div class="price-line">¥${esc(item.small_price)}${item.small_size ? " / "+esc(item.small_size) : ""}</div>` : "";

  const abvIbu = [
    item.abv ? `ALC ${esc(item.abv)}%` : "",
    item.ibu ? `IBU ${esc(item.ibu)}` : ""
  ].filter(Boolean).join("  ·  ");

  return `
<div class="card">
  <div class="card-num c-${esc(color)}">
    <span class="num">${no}</span>
  </div>
  <div class="card-body">
    <div class="row-top">
      <div class="info-left">
        <div class="brewery-tag">${esc(item.brewery)}<span class="flag">${esc(item.flag || "🇨🇳")}</span></div>
        <div class="beer-name">${esc(item.name || item.name_en || "待上新")}</div>
        <div class="beer-style">${esc(item.style)}</div>
      </div>
      <div class="price-block">${priceL}${priceS}</div>
    </div>
    <div class="divider"></div>
    <div class="row-bottom">
      <div class="info-en">
        <div class="en-name">${esc(item.name_en)}</div>
        <div class="en-style">${esc(item.style_en)}</div>
      </div>
      <div class="alc-info">${abvIbu}</div>
    </div>
  </div>
</div>`;
}

async function load() {
  try {
    const res  = await fetch(API, { cache: "no-store" });
    const data = await res.json();
    if (!data.ok) return;
    allItems = data.items.filter(it => it.name || it.name_en);

    if (IS_TV) {
      // TV 模式：直接渲染对应页
      const slice = allItems.slice(TV_OFFSET, TV_OFFSET + 8);
      document.getElementById("grid").innerHTML = renderSlice(slice);
    } else {
      // 预览模式：翻页渲染
      renderPreview();
    }
  } catch(e) {
    console.warn("menu load error", e);
  }
}

// ── 缩放：将 1920×1080 的画布等比缩放铺满屏幕 ──
function scaleToFit() {
  const root   = document.getElementById("root");
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  const offsetX = (window.innerWidth  - 1920 * scale) / 2;
  const offsetY = (window.innerHeight - 1080 * scale) / 2;
  root.style.transform = `scale(${scale})`;
  root.style.left = offsetX + "px";
  root.style.top  = offsetY + "px";
}
window.addEventListener("resize", scaleToFit);
scaleToFit();

// ── 自动刷新 ──
let timer;
document.addEventListener("visibilitychange", () =>
  document.hidden ? clearInterval(timer) : (load(), timer = setInterval(load, REFRESH))
);
load();
timer = setInterval(load, REFRESH);
</script>
</body>
</html>
