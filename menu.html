<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>酒单 · 时光酿造所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Anton&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }

    html, body {
      width:100%; height:100%;
      background:#111;
      overflow:hidden;
    }

    /* ── 固定画布 1920×1080，JS 负责缩放 ── */
    #root {
      position: fixed;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      background: #1c1c1c;
      font-family: 'Noto Sans SC', sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* ── 卡片网格：2列×4行 ── */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
    }

    /* ── 卡片 ── */
    .card {
      background: #fff;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    /* 左侧彩色编号竖条 */
    .card-num {
      width: 84px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num {
      font-family: 'Anton', sans-serif;
      font-size: 54px;
      color: #fff;
      letter-spacing: -2px;
      line-height: 1;
    }

    /* 右侧内容 */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* 上半 */
    .row-top {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 14px 20px 10px 16px;
      gap: 12px;
    }
    .info-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .brewery-tag {
      font-size: 15px;
      font-weight: 700;
      color: #666;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-name {
      font-weight: 900;
      font-size: 46px;
      color: #111;
      letter-spacing: 1px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .beer-style {
      font-size: 18px;
      color: #888;
      letter-spacing: 0.5px;
      white-space: nowrap;
      margin-top: 2px;
    }

    /* 价格 */
    .price-block {
      flex-shrink: 0;
      text-align: right;
    }
    .price-line {
      font-size: 24px;
      font-weight: 900;
      color: #222;
      line-height: 1.6;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* 分隔线 */
    .divider { height: 1px; background: #e0e0e0; margin: 0 16px }

    /* 下半 */
    .row-bottom {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 8px 20px 12px 16px;
      gap: 12px;
    }
    .info-en { flex: 1; min-width: 0 }
    .en-name {
      font-size: 18px;
      font-weight: 700;
      color: #444;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .en-style {
      font-size: 15px;
      color: #999;
      margin-top: 2px;
      white-space: nowrap;
    }
    .alc-info {
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 700;
      color: #aaa;
      text-align: right;
      white-space: nowrap;
    }

    /* 空卡片 */
    .card.empty .beer-name { color: #ddd; font-size: 28px; font-weight: 400 }

    /* 编号色块 */
    .c-yellow { background: #F5C400 }
    .c-red    { background: #C8252A }
    .c-orange { background: #E0621A }
    .c-dark   { background: #2B2B2B }
    .c-brown  { background: #5A3018 }
    .c-green  { background: #2E7D32 }
    .c-blue   { background: #1565C0 }
    .c-purple { background: #6A1B9A }
  </style>
</head>
<body>

<div id="root">
  <div class="grid" id="grid"></div>
</div>

<script>
const API     = "/api/menu-public";
const REFRESH = 30000;

const DEFAULT_COLORS = [
  'yellow','red','orange','dark','yellow','orange','red','dark',
  'yellow','red','brown','yellow','dark','orange','yellow','dark'
];

// ?page=1 → 第1-8，?page=2 → 第9-16，无参数 → 1-8（默认）
const PAGE = parseInt(new URLSearchParams(location.search).get("page") || "1", 10);
const OFFSET = (PAGE === 2) ? 8 : 0;

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function makeCard(item, idx) {
  const no    = String(item.no).padStart(2, "0");
  const color = item.color || DEFAULT_COLORS[idx] || "dark";
  const empty = !item.name && !item.name_en;

  const priceL = item.large_price
    ? `<div class="price-line">¥${esc(item.large_price)}${item.large_size ? " / "+esc(item.large_size) : ""}</div>` : "";
  const priceS = item.small_price
    ? `<div class="price-line">¥${esc(item.small_price)}${item.small_size ? " / "+esc(item.small_size) : ""}</div>` : "";

  const abvIbu = [
    item.abv ? `ALC ${esc(item.abv)}%` : "",
    item.ibu ? `IBU ${esc(item.ibu)}` : ""
  ].filter(Boolean).join("  ·  ");

  return `
<div class="card${empty ? " empty" : ""}">
  <div class="card-num c-${esc(color)}">
    <span class="num">${no}</span>
  </div>
  <div class="card-body">
    <div class="row-top">
      <div class="info-left">
        <div class="brewery-tag">${esc(item.brewery)}</div>
        <div class="beer-name">${esc(item.name || item.name_en || "待上新")}</div>
        <div class="beer-style">${esc(item.style)}</div>
      </div>
      <div class="price-block">${priceL}${priceS}</div>
    </div>
    <div class="divider"></div>
    <div class="row-bottom">
      <div class="info-en">
        <div class="en-name">${esc(item.name_en)}</div>
        <div class="en-style">${esc(item.style_en)}</div>
      </div>
      <div class="alc-info">${abvIbu}</div>
    </div>
  </div>
</div>`;
}

async function load() {
  try {
    const res  = await fetch(API, { cache: "no-store" });
    const data = await res.json();
    if (!data.ok) return;

    const slice = data.items.slice(OFFSET, OFFSET + 8);
    document.getElementById("grid").innerHTML =
      slice.map((it, i) => makeCard(it, OFFSET + i)).join("");
  } catch(e) {
    console.warn("menu load error", e);
  }
}

// ── 缩放：将 1920×1080 的画布等比缩放铺满屏幕 ──
function scaleToFit() {
  const root   = document.getElementById("root");
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  const offsetX = (window.innerWidth  - 1920 * scale) / 2;
  const offsetY = (window.innerHeight - 1080 * scale) / 2;
  root.style.transform = `scale(${scale})`;
  root.style.left = offsetX + "px";
  root.style.top  = offsetY + "px";
}
window.addEventListener("resize", scaleToFit);
scaleToFit();

// ── 自动刷新 ──
let timer;
document.addEventListener("visibilitychange", () =>
  document.hidden ? clearInterval(timer) : (load(), timer = setInterval(load, REFRESH))
);
load();
timer = setInterval(load, REFRESH);
</script>
</body>
</html>
